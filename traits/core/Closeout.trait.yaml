# The record's state is its lifecycle, and its history holds who was told and what became of the work, so the record
# composes Stateful beside this trait.
dependencies:
  - Stateful

metadata:
  created: "2026-11-17"
  owners:
    - Core team
  maturity: alpha
  accessibility:
    keyboard: The record's facts add no interactive control.
    screenreader: Each fact is read with its visible label, label first on the detail page and the form ("For, Northwind Traders") and value first on a list row or a card ("Northwind Traders, For").
  regionsUsed:
    - list
    - card
    - detail
    - form
  examples:
    - Closure
  references:
    - "draft-watts-oauth-agent-revocation-closure-04 (individual Internet-Draft, 16 Nov 2026): a closure receipt in six states, where PARTIAL, FAILED and UNKNOWN MUST NOT be interpreted as CLOSED"
    - "draft-hardt-oauth-aauth-protocol-11, section 11.12.3: a PS MAY report the outcome of a revocation the person initiated to that person, per recipient"
    - "draft-abak-agent-control-delivery-evidence-02 (individual Internet-Draft, 11 Oct 2026): one result per instruction and target, APPLIED, REFUSED, NO_EFFECT or UNKNOWN, and work already in flight"
