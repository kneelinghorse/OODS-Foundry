      position: after
      props:
        field: closes_id
        description: What ended
        data-oods-omit-empty: true
    - component: LabelCell
      position: after
      props:
        field: for_id
        description: For
        data-oods-omit-empty: true
  detail:
    - component: Text
      position: main
      priority: 90
      props:
        field: closes_id
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 89
      props:
        field: closes_name
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 88
      props:
        field: ended_how
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 87
      props:
        field: ended_at
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 86
      props:
        field: for_id
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 85
      props:
        field: for_name
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 84
      props:
        field: scope
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 83
      props:
        field: summary
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 82
      props:
        field: deadline_at
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 81
      props:
        field: still_works_until
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 80
      props:
        field: still_works_note
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 79
      props:
        field: receipt_sent_at
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 78
      props:
        field: receipt_sent_to_name
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 77
      props:
        field: receipt_channel
        data-oods-omit-empty: true

  # On a form every fact is read beside the status and edited nowhere (`fact: true`, as Mandate's terms are): your product
  # writes them when it reports. On the shipped Closure there is no form at all.
  form:
    - component: Text
      position: top
      priority: 90
      fact: true
      props:
        field: closes_id
        data-oods-omit-empty: true
    - component: Text
      position: top
      priority: 89
      fact: true
      props:
        field: closes_name
        data-oods-omit-empty: true
    - component: Text
      position: top
