      label: Answered by
  answered_by_kind:
    semantic_type: decision.answered_by.kind
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Kind of answerer
  answered_for_id:
    semantic_type: decision.answered_for.id
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Answered for
      displayLabelField: answered_for_name
  answered_for_name:
    semantic_type: decision.answered_for.name
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Answered for
  subject_type:
    semantic_type: decision.subject.type
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Kind of thing
  subject_id:
    semantic_type: decision.subject.id
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Approving
      displayLabelField: subject_name
  subject_name:
    semantic_type: decision.subject.name
    token_mapping: tokenMap(text.body.*)
    ui_hints:
