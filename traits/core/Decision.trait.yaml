view_extensions:
  # The record travels with its facts on every surface it is read on. Each renders as labelled text, so a level or a
  # meaning never reads as part of the value beside it. A reference is placed by its id, which shows its kept name; the
  # row for the kept name alone is placed too, and the detail drops it wherever the id already shows the name, so a
  # source that keeps only a name still shows it and one that keeps only an id shows the id.
  list:
    - component: Text
      position: after
      props:
        field: level
    - component: Text
      position: after
      props:
        field: asked_of_id
  # s245-m02: a card names the thing in the record's own name already, so it adds the level and who was asked.
  card:
    - component: Text
      position: after
      props:
        field: level
        label: Level
    - component: Text
      position: after
      props:
        field: asked_of_id
        label: Asked of
  detail:
    - component: Text
      position: main
      priority: 80
      props:
        field: subject_id
    - component: Text
      position: main
      priority: 79
      props:
        field: subject_name
    - component: Text
      position: main
      priority: 78
      props:
        field: subject_type
    - component: Text
      position: main
      priority: 77
      props:
        field: shown
    - component: Text
      position: main
      priority: 76
      props:
        field: level
    - component: Text
      position: main
      priority: 75
      props:
        field: meaning
    - component: Text
      position: main
      priority: 74
      props:
        field: requested_by_id
    - component: Text
      position: main
      priority: 73
      props:
        field: requested_by_name
    - component: Text
      position: main
      priority: 72
      props:
        field: requested_by_kind
    - component: Text
      position: main
      priority: 71
      props:
        field: requested_for_id
    - component: Text
      position: main
      priority: 70
      props:
        field: requested_for_name
    - component: Text
      position: main
      priority: 69
      props:
        field: asked_of_id
    - component: Text
      position: main
      priority: 68
      props:
        field: asked_of_name
    - component: Text
      position: main
      priority: 67
      props:
        field: answered_by_id
    - component: Text
      position: main
      priority: 66
      props:
        field: answered_by_name
    - component: Text
      position: main
      priority: 65
      props:
        field: answered_by_kind
    - component: Text
      position: main
      priority: 64
      props:
        field: answered_for_id
    - component: Text
      position: main
      priority: 63
      props:
        field: answered_for_name
    # The times are labelled rows too, read as dates beside the other facts.
    - component: Text
      position: main
      priority: 62
      props:
        field: asked_at
    - component: Text
      position: main
      priority: 61
      props:
        field: due_at
    - component: Text
      position: main
      priority: 60
      props:
        field: answered_at
    - component: Text
      position: main
      priority: 59
      props:
        field: comment

  # s245-m02: on the form, the screen where an answer is given, the four facts are read beside the answer and are not
  # edited there: the thing, exactly what was shown, the level and its meaning. `fact: true` is the mark that makes a form
  # view a fact (no 0.12.0 form view carries it): the field stays in the form's record and gets no editing control.
  form:
    - component: Text
      position: top
      priority: 80
      fact: true
      props:
        field: subject_id
    - component: Text
      position: top
      priority: 79
      fact: true
      props:
        field: subject_name
    - component: Text
      position: top
      priority: 78
      fact: true
      props:
        field: shown
    - component: Text
      position: top
      priority: 77
      fact: true
      props:
        field: level
    - component: Text
      position: top
      priority: 76
      fact: true
      props:
        field: meaning

# The answer is the record's lifecycle, so the record composes Stateful beside this trait.
dependencies:
  - Stateful

metadata:
  created: "2026-11-11"
  owners:
    - Core team
  maturity: alpha
  accessibility:
    keyboard: The record's facts add no interactive control; they render as labelled text.
    screenreader: Each fact is read with its visible label ("Level, Approval"; "What this yes means, Sign-off. You answer for this release").
  regionsUsed:
    - list
    - card
    - detail
    - form
  examples:
    - Approval
  references:
    - "21 CFR 11.50: a signed electronic record shows the signer's name, the date and time, and the meaning associated with the signature"
    - "ServiceNow sysapproval_approver: one approval record per approver, with Approving (document_id), Approver and State"
    - "Coupa /api/approvals/<approval id>: approvable_type and approvable_id name the thing approved"
    - "Jira Service Management ApproverDTO: approver (UserDTO) and approverDecision (approved, declined, pending)"
