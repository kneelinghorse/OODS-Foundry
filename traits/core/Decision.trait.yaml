    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Asked of
      displayLabelField: asked_of_name
  asked_of_name:
    semantic_type: decision.asked_of.name
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Asked of
  answered_by_id:
    semantic_type: decision.answered_by.id
    token_mapping: tokenMap(text.body.*)
