view_extensions:
  # The record travels with its facts on every surface it is read on, each as labelled text. A reference is placed by
  # its id, which shows its kept name. On the detail page and the form the kept name's row is placed too, and where both
  # are placed the name's row is read and the id's row is dropped, so there a source that keeps only a name still shows
  # it and one that keeps only an id shows the id. A list row and a card place the id alone. Every place is left undrawn where the record holds no value for it (`data-oods-omit-empty`). A grant
  # with no end says so in its end line, which the product writes ("No end: it stands until someone ends it"), so an
  # empty end is never drawn as "Not recorded" and never reads as if the grant ends.
  # On a list row and a card a Text's label is not shown, so the holder, the party and the end are each a value over
  # its caption ("Billing Agent", "Held by"); the object's summary line is its scope.
  list:
    - component: LabelCell
      position: after
      props:
        field: granted_to_id
        description: Held by
        data-oods-omit-empty: true
    - component: LabelCell
      position: after
      props:
        field: granted_for_id
        description: For
        data-oods-omit-empty: true
    - component: LabelCell
      position: after
      props:
        field: ends_note
        description: Ends
        data-oods-omit-empty: true
  card:
    - component: LabelCell
      position: after
      props:
        field: granted_to_id
        description: Held by
        data-oods-omit-empty: true
    - component: LabelCell
      position: after
      props:
        field: granted_for_id
        description: For
        data-oods-omit-empty: true
    - component: LabelCell
      position: after
      props:
        field: ends_note
        description: Ends
        data-oods-omit-empty: true
  detail:
    # The currency is read in the amounts it qualifies ("$12,000.00"), so it has no row of its own. The end reads in the
    # party's words first, then as the instant in UTC, labelled so, with the party's zone beside it.
    - component: Text
      position: main
      priority: 90
      props:
        field: scope
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 89
      props:
        field: granted_for_id
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 88
      props:
        field: granted_for_name
        data-oods-omit-empty: true
    - component: Text
