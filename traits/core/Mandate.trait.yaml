  # On the form, the screen where the grant's state is changed, its terms and seats are read beside the status and are
  # not edited there (`fact: true`, as Decision's are): a change of terms is a new grant, made by the product. Each party
  # is placed by its id and its kept name: an import binds a party by its id alone, and where both are kept the form reads
