metadata:
  created: "2026-11-14"
  owners:
    - Core team
  maturity: alpha
  accessibility:
    keyboard: The record's facts add no interactive control; why it ended is a labelled form input.
    screenreader: Each fact is read with its visible label, label first on the detail page and the form ("Held by, Billing Agent") and value first on a list row or a card ("Billing Agent, Held by").
  regionsUsed:
    - list
    - card
    - detail
    - form
  examples:
    - Grant
  references:
    - "OAuth 2.0 Rich Authorization Requests (RFC 9396): each item has a type that sets its allowed contents, and names the actions to be taken at the resource"
    - "UK Open Banking VRP consents (v4.0.1): a maximum per payment instruction and per period, and values supplied in the consent must not change"
    - "FDX 6.6 consent grant: a status of ACTIVE, EXPIRED or REVOKED, with the reason for a revocation and the party that started it"
    - "GDPR Article 7(3): It shall be as easy to withdraw as to give consent"
