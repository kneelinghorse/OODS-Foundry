trait:
  name: Mandate
  version: 1.0.0
  description: |
    The record of a grant: a standing yes that one actor may act for a person or organization, on stated terms,
    until it ends. It keeps who asked for it, who gave it and in what capacity, who holds it and who it is for; what it
    covers in words, its three lines for that party, its limits and its end; its use as the product counts it; the
    grant it sits inside or replaced; and who ended it and why. The Grant object composes this trait, and the importer
    can propose it for another system's grant or consent record that keeps a state, an end and the agent or app that
    holds it, so every field lives here and a proposal can bind what the source has.

    The state of the grant is not a field of this trait. It is the record's own lifecycle, through Stateful: for a
    Grant, requested, then active (or paused), declined or withdrawn, and a grant once given ends revoked, expired or
    replaced. Its terms are not
    edited in place. A change of terms is a new grant that names the one it replaces, and a standing yes for one
    action is a new grant inside the first, with its own bounds and end.

    A reference to a person, an agent, an organization or another grant is an id and a kept name, so it still reads
    after the person leaves or the grant ends. The kinds are the Actor trait's three words: person, agent or system.
    The three lines follow the Agent's own: items separated by "; ", and "None" when there are none. The money limits
    are whole numbers in the currency's minor units at two decimal places, so a currency with other decimals reads
    wrong. The end is kept three ways: the exact instant a product checks, the party's time zone, and one line in the
    party's own words and zone, which is what people read.

    OODS Foundry keeps and shows this record. It does not check a grant against what an actor does, count its uses or
    spend, expire, pause, revoke or renew one, stop a token or decide whether an action was allowed.
  category: core
  # Compound tags: a trait's tags are inherited by the components it places (Text, LabelCell, Input), and an intent's
  # words never match a compound tag, so these describe the trait without changing how any screen picks its components.
  tags:
    - grant-record
    - standing-yes
    - actor-reference
    - kept-terms

# No parameter: the states are the record's own lifecycle, declared through Stateful. The minor-units factor of the money
# limits is fixed at 100.
parameters: []

# Every field but one is written by the product, when the grant is asked for, given, used and ended, so a form never
# edits it (readOnly). Why a grant ended is written where it is ended, on the grant's form, so the form offers it. The
# terms and the seats are still read on the form (below).
schema:
  requested_by_id:
    type: string
    required: false
    readOnly: true
    description: 'Who asked for the grant, by the id the product knows them by: a person, or the agent itself.'
  requested_by_name:
    type: string
    required: false
    readOnly: true
    description: 'Who asked for the grant, as shown ("Billing Agent"). Kept on the record.'
  requested_by_kind:
    type: string
    required: false
    readOnly: true
    description: What kind of actor asked for it (person, agent or system), as the Actor trait names them.
    validation:
      enum:
        - person
        - agent
        - system
  granted_by_id:
    type: string
    required: false
    readOnly: true
    description: 'Who gave the grant, by the id the product knows them by: usually a person who may give it for the party.'
  granted_by_name:
    type: string
    required: false
    readOnly: true
    description: 'Who gave the grant, as shown ("Ruth Adeyemi"). Kept on the record, so it still reads after they leave.'
  granted_by_kind:
    type: string
    required: false
    readOnly: true
    description: What kind of actor gave it (person, agent or system), as the Actor trait names them.
    validation:
      enum:
        - person
        - agent
        - system
  granted_as:
    type: string
    required: false
    readOnly: true
    description: 'The capacity the giver gave it in, in one line ("Finance manager, Tidewater Co-op").'
    validation:
      maxLength: 120
  granted_to_id:
    type: string
    required: false
    readOnly: true
    description: 'Who holds the grant and acts under it, by the id the product knows them by: an agent, or a person standing in for someone.'
  granted_to_name:
    type: string
    required: false
    readOnly: true
    description: 'Who holds the grant, as shown ("Billing Agent"). Kept on the record.'
  granted_to_kind:
    type: string
    required: false
    readOnly: true
    description: What kind of actor holds it (person, agent or system), as the Actor trait names them.
    validation:
      enum:
        - person
        - agent
        - system
  granted_for_id:
    type: string
    required: false
    readOnly: true
    description: Who the grant is for, the person or organization the holder acts for, by the id the product knows them by. Never an agent.
  granted_for_name:
    type: string
    required: false
    readOnly: true
    description: 'Who the grant is for, as shown ("Tidewater Co-op"). Kept on the record.'
  scope:
    type: string
    required: false
    readOnly: true
    description: 'What the grant covers, in a few words ("Invoices and payments").'
    validation:
      maxLength: 160
  allowed_actions:
    type: string
    required: false
    readOnly: true
    description: 'Actions the holder may take for this party with no one asked, separated by "; "; None when there are none.'
  asks_first_for:
    type: string
    required: false
    readOnly: true
    description: 'Actions that need a person''s yes before the holder takes them for this party, separated by "; "; None when there are none.'
  never_allowed:
    type: string
    required: false
    readOnly: true
    description: 'Actions the holder never takes for this party, separated by "; "; None when there are none. An action for the party that no line names is never allowed; asking the person who gave it for a yes or an answer is not one.'
  amount_limit_minor:
    type: integer
    required: false
    readOnly: true
    description: The most the holder may move in one use, in the currency's minor units (1200000 is $12,000.00).
    validation:
      minimum: 0
  period_limit_minor:
    type: integer
    required: false
    readOnly: true
    description: The most the holder may move in each period, in the currency's minor units.
    validation:
      minimum: 0
  limit_currency:
    type: string
    required: false
    readOnly: true
    description: 'The currency of the money limits, as an ISO 4217 code ("USD").'
    validation:
      pattern: '^[A-Z]{3}$'
  limit_period:
    type: string
    required: false
    readOnly: true
    description: The period the limits per period count over.
    validation:
      enum:
        - day
        - week
        - month
        - year
  uses_per_period:
    type: integer
    required: false
    readOnly: true
    description: The most times the grant may be used in each period.
    validation:
      minimum: 0
  conditions:
    type: string
    required: false
    readOnly: true
    description: 'Conditions on each use, in words, shown and not checked ("Only a payment the bank returned, to the same payee for the same amount").'
    validation:
      maxLength: 240
  ends_at:
    type: datetime
    required: false
    readOnly: true
    description: The exact instant the grant ends, the one a product checks.
    validation:
      format: date-time
  timezone:
    type: string
    required: false
    readOnly: true
    description: 'The party''s time zone, as an IANA name ("Pacific/Auckland"), the zone its end is read in.'
    validation:
      maxLength: 64
  ends_note:
    type: string
    required: false
    readOnly: true
    description: 'The end as people read it, in the party''s own words and time zone ("At the end of 31 Dec 2026, Tauranga time"), written by the product; a grant with no end says so here ("No end: it stands until someone ends it").'
    validation:
      maxLength: 160
  uses:
    type: integer
    required: false
    readOnly: true
    description: How many times the grant has been used, as the product counts it.
    validation:
      minimum: 0
  last_used_at:
    type: datetime
    required: false
    readOnly: true
    description: When the grant was last used.
    validation:
      format: date-time
  last_use:
    type: string
    required: false
    readOnly: true
    description: 'The last use, in one kept line ("28 Sep: PAY-2026-0429 sent again").'
    validation:
      maxLength: 240
  spent_minor:
    type: integer
    required: false
    readOnly: true
    description: The money moved under the grant in the current period, as the product counts it, in the currency's minor units.
    validation:
      minimum: 0
  within_id:
    type: string
    required: false
    readOnly: true
    description: 'The grant this one sits inside, for a standing yes given for one action: same holder, same party, ending no later.'
  within_name:
    type: string
    required: false
    readOnly: true
    description: The grant this one sits inside, as shown. Kept on the record.
  replaces_id:
    type: string
    required: false
    readOnly: true
    description: The grant this one replaced when the terms changed; that grant is kept whole, ended as replaced.
  replaces_name:
    type: string
    required: false
    readOnly: true
    description: The grant this one replaced, as shown. Kept on the record.
  first_grant_id:
    type: string
    required: false
    readOnly: true
    description: The first grant in a line of replacements, kept on every later grant in the line so a search by its name finds them all.
  first_grant_name:
    type: string
    required: false
    readOnly: true
    description: The first grant in the line, as shown. Kept on the record.
  ended_by_id:
    type: string
    required: false
    readOnly: true
    description: Who ended the grant, by the id the product knows them by, when someone did.
  ended_by_name:
    type: string
    required: false
    readOnly: true
    description: Who ended the grant, as shown. Kept on the record.
  ended_by_kind:
    type: string
    required: false
    readOnly: true
    description: What kind of actor ended it (person, agent or system), as the Actor trait names them.
    validation:
      enum:
        - person
        - agent
        - system
  ended_reason:
    type: string
    required: false
    description: 'Why the grant ended, in one line, written where it is ended ("The studio closed").'
    validation:
      maxLength: 240

