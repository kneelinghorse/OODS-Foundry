trait:
  name: Assignment
  version: 1.0.0
  description: |
    The record of one ask to one person or agent to do one piece of work, and what became of it: who asked, and for
    whom; who is doing it; exactly what was asked; what the work is about; what it waits on; where it came from; and
    how it ended. A task is an ask, not a ticket: the thing the work is about (an invoice, a payment, an issue) stays
    the product's own record, and the task points at it. The Task object composes this trait, and the importer
    proposes it for another system's record of work, so every field lives here and a proposal can bind what the
    source has.

    The state of the work is not a field of this trait. It is the record's own lifecycle, through Stateful: for a
    Task, not started, working, needs input, waiting, paused, outcome unknown, and its five endings. A changed ask is
    a new task. Handing the whole of the work on ends this one and starts another that names it as the one it came
    from; asking for help with a part starts another while this one waits.

    A reference to a person, an agent, a task or a thing is an id and a kept name. The name is kept on the record, so
    it still reads after the person leaves or the thing is deleted, and the record's rows show it in place of the id;
    the closed Reference details block lists the ids themselves. The kinds are the Actor trait's words: who asked can
    be a person, an agent or a system (an automation); the one doing the work is a person or an agent. No field says
    what the one doing the work may do: their authority lives on their own record, a person's account and roles, an
    agent's rules and any grant it holds from the one the work is for.

    OODS Foundry keeps and shows this record. It does not run, retry, pause, cancel or time out the work, check who may
    do it, or keep the try count, what a task waits on or the first ask true.
  category: core
  # Compound tags: a trait's tags are inherited by the components it places (Text, Input), and an intent's words never
  # match a compound tag, so these describe the trait without changing how any screen picks its components.
  tags:
    - task-record
    - work-record
    - actor-reference
    - kept-ask

# No parameter: the states are the record's own lifecycle, declared through Stateful.
parameters: []

# Every field but three is written by the product, when the work is asked for and as it goes, so a form never edits it
# (readOnly). The result line, the due date and what the work waits on are written by whoever is doing it, a person
# doing their own task among them, so the form offers them. The ask's facts are still read on the form (below).
schema:
  instruction:
    type: string
    required: true
    readOnly: true
    description: |
      Exactly what was asked, in one line ("Count the flour and butter in stock before Monday's supplier order"). It
      is written once: a changed ask is a new task.
    validation:
      maxLength: 240
  requested_by_id:
    type: string
    required: false
    readOnly: true
    description: Who asked for the work, by the id the product knows them by. An agent may ask, and may ask itself.
  requested_by_name:
    type: string
    required: false
    readOnly: true
    description: Who asked, as shown ("Billing Agent"). Kept on the record.
  requested_by_kind:
    type: string
    required: false
    readOnly: true
    description: What kind of actor asked (person, agent or system), as the Actor trait names them.
    validation:
      enum:
        - person
        - agent
        - system
  requested_for_id:
    type: string
    required: false
    readOnly: true
    description: Who the work is for, the person or organization it serves.
  requested_for_name:
    type: string
    required: false
    readOnly: true
    description: Who the work is for, as shown ("Tidewater Co-op"). Kept on the record.
  asked_of_id:
    type: string
    required: false
    readOnly: true
    description: |
      Who is doing the work, by the id the product knows them by. One record is one ask to one actor, and after the work
      ends this still names the one who was asked to do it.
  asked_of_name:
    type: string
    required: false
    readOnly: true
    description: Who is doing the work, or did it, as shown ("Billing Agent"). Kept on the record.
  asked_of_kind:
    type: string
    required: false
    readOnly: true
    description: What kind of actor is doing the work, a person or an agent, as the Actor trait names them.
    validation:
      enum:
        - person
        - agent
  subject_type:
    type: string
    required: false
    readOnly: true
    description: What kind of thing the work is about ("Transaction", "Invoice"). A task can be about nothing on record.
  subject_id:
    type: string
    required: false
    readOnly: true
    description: The thing the work is about, by the id the product calls it by (a payment's reference).
  subject_name:
    type: string
    required: false
    readOnly: true
    description: The thing the work is about, as shown. Kept on the record, so it still reads after the thing is deleted.
  due_at:
    type: datetime
    required: false
    description: When the work is due, when someone sets a date.
    validation:
      format: date-time
  waiting_on_type:
    type: string
    required: false
    readOnly: true
    description: |
      What kind of thing the work waits on, which says what kind of wait it is: an Approval, a person, another task,
      or something outside, such as a payment at the bank. Set only while the work needs input or waits.
  waiting_on_id:
    type: string
    required: false
    readOnly: true
    description: What the work waits on, by the id the product knows it by.
  waiting_on_name:
    type: string
    required: false
    description: What the work waits on, in a few words ("PAY-2026-0429 at the bank"). Set it only while the work needs input or waits.
  parent_id:
    type: string
    required: false
    readOnly: true
    description: The task this one came from, when another task handed it on or asked for it.
  parent_name:
    type: string
    required: false
    readOnly: true
    description: The task this one came from, as shown. Kept on the record.
  origin_id:
    type: string
    required: false
    readOnly: true
    description: The first ask in a chain of tasks, kept on every task in the chain so a search by its name finds them all.
  origin_name:
    type: string
    required: false
    readOnly: true
    description: The first ask in the chain, as shown. Kept on the record.
  result:
    type: string
    required: false
    description: What came of the work, in one line, in the words of whoever did it. Finished is their word, not someone else's acceptance.
    validation:
      maxLength: 240
  tries:
    type: integer
    required: false
    readOnly: true
    description: |
      How many times the work itself has been tried: a send, a payment, a count. Getting ready to do it is not a try. A
      try is not a change of state, so it is counted here.
    validation:
      minimum: 0
  last_try:
    type: string
    required: false
    readOnly: true
    description: 'When the last try was and how it ended, in one kept line ("29 Sep, 09:15: sent again; no answer yet").'
    validation:
      maxLength: 240

semantics:
