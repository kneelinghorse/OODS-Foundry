    ui_hints:
      component: Text
      label: Asked for
  asked_of_id:
    semantic_type: assignment.asked_of.id
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Doing it
      displayLabelField: asked_of_name
  asked_of_name:
    semantic_type: assignment.asked_of.name
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Doing it
  asked_of_kind:
    semantic_type: assignment.asked_of.kind
    token_mapping: tokenMap(text.body.*)
    ui_hints:
