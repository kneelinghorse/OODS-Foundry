    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Asked by
      displayLabelField: requested_by_name
  requested_by_name:
    semantic_type: assignment.requested_by.name
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Asked by
  requested_by_kind:
