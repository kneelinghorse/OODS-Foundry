      component: Text
      label: About
      displayLabelField: subject_name
  subject_name:
    semantic_type: assignment.subject.name
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: About
  due_at:
    semantic_type: assignment.due_at
    token_mapping: tokenMap(text.body.*)
