      component: RelativeTimestamp
      label: Due
  waiting_on_type:
    semantic_type: assignment.waiting_on.type
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Kind of thing waited on
  waiting_on_id:
    semantic_type: assignment.waiting_on.id
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Waiting on
      displayLabelField: waiting_on_name
  waiting_on_name:
    semantic_type: assignment.waiting_on.name
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Waiting on
  parent_id:
    semantic_type: assignment.parent.id
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Came from
      displayLabelField: parent_name
  parent_name:
    semantic_type: assignment.parent.name
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Came from
  origin_id:
    semantic_type: assignment.origin.id
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: First ask
      displayLabelField: origin_name
  origin_name:
    semantic_type: assignment.origin.name
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: First ask
  result:
    semantic_type: assignment.result
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Result
  tries:
