      component: Text
      label: Last try

view_extensions:
  # The record travels with its facts on every surface it is read on, each as labelled text. A reference is placed by
  # its id, which shows its kept name; the row for the kept name alone is placed too, and the detail drops it wherever
  # the id already shows the name, so a source that keeps only a name still shows it and one that keeps only an id
  # shows the id. `data-oods-omit-empty` is the opt-in that leaves a place undrawn where the record holds no value for
  # it, so a task that waits on nothing has no "Waiting on" line; no view in 0.13.1 carries it.
  # On a list row and a card a Text's label is not shown, so the one doing the work and what it waits on are each a
  # value over its caption ("Billing Agent", "Doing it"): a row also carries the chip of the one who answers for the work
  # (Ownerable on Task), and two bare names side by side do not say which is which (s247-m01 screens, round 1).
  list:
    - component: LabelCell
      position: after
      props:
        field: asked_of_id
        description: Doing it
        data-oods-omit-empty: true
    - component: LabelCell
      position: after
      props:
        field: waiting_on_id
        description: Waiting on
        data-oods-omit-empty: true
  card:
    - component: LabelCell
      position: after
      props:
        field: asked_of_id
        description: Doing it
        data-oods-omit-empty: true
    - component: LabelCell
      position: after
      props:
        field: waiting_on_id
        description: Waiting on
        data-oods-omit-empty: true
  detail:
    - component: Text
      position: main
      priority: 80
      props:
        field: instruction
    - component: Text
      position: main
      priority: 79
      props:
        field: subject_id
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 78
      props:
        field: subject_name
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 77
      props:
        field: subject_type
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 76
      props:
        field: requested_by_id
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 75
      props:
        field: requested_by_name
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 74
      props:
        field: requested_by_kind
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 73
      props:
        field: requested_for_id
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 72
      props:
        field: requested_for_name
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 71
      props:
        field: asked_of_id
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 70
      props:
        field: asked_of_name
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 69
      props:
        field: asked_of_kind
        data-oods-omit-empty: true
    # The times are labelled rows too, read as dates beside the other facts.
    - component: Text
      position: main
      priority: 68
      props:
        field: due_at
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 67
      props:
        field: waiting_on_id
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 66
      props:
        field: waiting_on_name
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 65
      props:
        field: waiting_on_type
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 64
      props:
        field: result
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 63
      props:
        field: tries
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 62
      props:
        field: last_try
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 61
      props:
        field: parent_id
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 60
      props:
        field: parent_name
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 59
      props:
        field: origin_id
        data-oods-omit-empty: true
    - component: Text
      position: main
      priority: 58
      props:
        field: origin_name
        data-oods-omit-empty: true

  # On the form, the screen where the work's state is changed, the ask's facts are read beside the status and are not
  # edited there: what was asked, who asked and for whom, and who is doing it (`fact: true`, as Decision's are). Each
  # party is placed by its id and its kept name: an import binds a party by its id alone, and where both are kept the
  # form reads the name and leaves the id's row out. The three fields a person doing the work writes are given their own
  # controls here, because a form has ten field slots and a task has more candidates than that.
  form:
    - component: Text
      position: top
      priority: 80
      fact: true
      props:
        field: instruction
    - component: Text
      position: top
      priority: 79
      fact: true
      props:
        field: requested_by_id
        data-oods-omit-empty: true
    - component: Text
      position: top
      priority: 78
      fact: true
      props:
        field: requested_by_name
        data-oods-omit-empty: true
    - component: Text
      position: top
      priority: 77
      fact: true
      props:
        field: requested_for_id
        data-oods-omit-empty: true
    - component: Text
      position: top
      priority: 76
      fact: true
      props:
        field: requested_for_name
        data-oods-omit-empty: true
    - component: Text
      position: top
      priority: 75
      fact: true
      props:
        field: asked_of_id
        data-oods-omit-empty: true
    - component: Text
      position: top
      priority: 74
      fact: true
      props:
        field: asked_of_name
        data-oods-omit-empty: true
    - component: Input
      position: main
      priority: 60
      props:
        field: result
    - component: Input
      position: main
      priority: 59
      props:
        field: due_at
    - component: Input
      position: main
      priority: 58
      props:
        field: waiting_on_name

# The state of the work is the record's lifecycle, so the record composes Stateful beside this trait.
dependencies:
  - Stateful

metadata:
  created: "2026-11-13"
  owners:
    - Core team
  maturity: alpha
  accessibility:
    keyboard: The record's facts add no interactive control; the three fields the doer writes are labelled form inputs.
    screenreader: Each fact is read with its visible label, label first on the detail page and the form ("Doing it, Billing Agent") and value first on a list row or a card ("Billing Agent, Doing it").
  regionsUsed:
    - list
    - card
    - detail
    - form
  examples:
    - Task
  references:
    - "HL7 FHIR R5 Task: requester (the creator of the task), owner (responsible for managing its execution), performer and for (who benefits)"
    - "A2A v1.0.1: a Task is server-generated in response to a message, and a task in a terminal state cannot restart; a follow-up is a new task"
    - "Linear AgentSession: tracks the lifecycle of an agent run; its creator is the human user responsible for the session"
    - "OASIS WS-HumanTask 1.1: sub-tasks identify their parent task (parentTaskId)"
