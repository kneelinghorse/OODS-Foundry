object:
  name: Plan
  version: 1.0.0
  domain: saas.billing
  description: Normalized plan definition capturing pricing, packaging, and entitlement metadata.
  tags:
    - billing
    - plan
    - packaging

traits:
  - name: SaaSBillingBillable
    alias: Pricing
  - name: SaaSBillingMetered
    alias: IncludedUsage
    parameters:
      unit: seats
      rolloverStrategy: none
      sampleWindowDays: 30
  - name: structural/Ownerable
    alias: PlanOwnership

schema:
  plan_id:
    type: string
    required: true
    description: Stable identifier for the plan within the billing domain.
  product_family:
    type: string
    required: true
    description: High level product family grouping for analytics and reporting.
  status:
    type: string
    required: true
    description: Availability state of the plan (active, deprecated, private_beta).
    validation:
      enum:
        - active
        - deprecated
        - private_beta
        - legacy
  feature_matrix:
    type: FeatureDescriptor[]
    required: false
    description: Array of feature descriptors listing entitlement tiers.
    default: []
  add_on_ids:
    type: string[]
    required: false
    description: Identifiers for add-ons commonly sold with this plan.
    default: []
  upgrade_targets:
    type: string[]
    required: false
    description: Plans presented as upgrade destinations.
    default: []
  downgrade_targets:
    type: string[]
    required: false
    description: Plans that can be downgraded to from this plan.
    default: []
  notes:
    type: string
    required: false
    description: Internal commentary for packaging or finance teams.
  owner_name:
    type: string
    required: false
    description: Display name of the team that owns the plan.

semantics:
  plan_id:
    semantic_type: billing.plan.id
    token_mapping: tokenMap(billing.plan.id)
  # The one-line summary under the plan's name in lists: the product family it belongs to.
  product_family:
    semantic_type: text.summary
    token_mapping: tokenMap(billing.plan.product_family)
  # structural/Ownerable's owner reference, named by owner_name.
  owner_id:
    semantic_type: ownership.owner.id
    token_mapping: tokenMap(ownership.owner.id)
    ui_hints:
      component: OwnerReference
      ownerTypeField: owner_type
      displayLabelField: owner_name
  status:
    semantic_type: billing.plan.status
    token_mapping: tokenMap(billing.plan.status)
  feature_matrix:
    semantic_type: billing.plan.feature_matrix
    token_mapping: tokenMap(billing.plan.feature_matrix)
  add_on_ids:
    semantic_type: billing.plan.add_on_ids
    token_mapping: tokenMap(billing.plan.add_on_ids)
  upgrade_targets:
    semantic_type: billing.plan.upgrade_targets
    token_mapping: tokenMap(billing.plan.upgrade_targets)
  downgrade_targets:
    semantic_type: billing.plan.downgrade_targets
    token_mapping: tokenMap(billing.plan.downgrade_targets)
  notes:
    semantic_type: billing.plan.notes
    token_mapping: tokenMap(billing.plan.notes)

tokens:
  billing.plan.id: "var(--cmp-text-strong)"
  billing.plan.status: "var(--cmp-badge-text-info)"
  billing.plan.product_family: "var(--cmp-text-subtle)"

metadata:
  owners:
    - product@oods.systems
    - pricing@oods.systems
  maturity: beta
  references:
    - R13.5 Canonical Model: Subscription and Invoice

# Authored type associations; no record join or referential-integrity claim.
relationships:
  - target: Plan
    via: upgrade_targets
    cardinality: many-to-many
    label: Upgrade destinations
  - target: Plan
    via: downgrade_targets
    cardinality: many-to-many
    label: Downgrade destinations

# Eight authored sample plans: the price book the sample subscriptions are on (their plan_code), plus a deprecated, a
# legacy and a private-beta plan. Prices are list prices in US dollars; the period is the price book the price belongs
# to, and each plan is owned by the team that prices it.
samples:
  - plan_id: plan_starter_monthly
    plan_code: starter-monthly
    plan_name: Starter
    product_family: Workspace plans
    status: active
    billing_interval: monthly
    interval_count: 1
    amount_minor: 1900
    currency: USD
    trial_period_days: 0
    collection_method: charge_automatically
    pricing_model: flat
    meter_name: Seats
    included_quantity: 3
    overage_rate_minor: 500
    period_start: '2026-01-01'
    period_end: '2026-12-31'
    upgrade_targets: [team-monthly]
    downgrade_targets: []
    add_on_ids: []
    owner_id: team_pricing
    owner_type: team
    owner_name: Pricing and packaging
    notes: Entry plan for single-location shops.
  - plan_id: plan_team_monthly
    plan_code: team-monthly
    plan_name: Team
    product_family: Workspace plans
    status: active
    billing_interval: monthly
    interval_count: 1
    amount_minor: 4900
    currency: USD
    trial_period_days: 14
    collection_method: charge_automatically
    pricing_model: flat
    meter_name: Seats
    included_quantity: 10
    overage_rate_minor: 500
    period_start: '2026-01-01'
    period_end: '2026-12-31'
    upgrade_targets: [business-monthly]
    downgrade_targets: [starter-monthly]
    add_on_ids: [analytics-addon-monthly]
