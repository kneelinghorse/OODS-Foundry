    amount_minor: 49000
    currency: USD
    trial_period_days: 14
    collection_method: charge_automatically
    pricing_model: flat
    meter_name: Seats
    included_quantity: 10
    overage_rate_minor: 500
    period_start: '2025-01-01'
    period_end: '2025-12-31'
