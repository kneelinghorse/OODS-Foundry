object:
  name: Usage
  version: 1.0.0
  domain: saas.billing
  description: Metered usage snapshot for consumption based billing supporting trend analysis and overage forecasting.
  tags:
    - billing
    - usage
    - analytics

traits:
  - name: SaaSBillingMetered
    alias: MeterReading
    parameters:
      unit: api_calls
      rolloverStrategy: expire
      sampleWindowDays: 7
  - name: lifecycle/Timestampable
    alias: UsageAudit
    parameters:
      recordedEvents:
        - reading_captured
        - anomaly_detected
        - reset
      timezone: UTC
      allowNullUpdatedAt: true
  # s223-m01 (#2527 ruling 5): the chart is the record's own readings, its y axis titled with the record's unit label.
  - name: viz/MarkLine
    parameters:
      title: Usage readings
      description: Readings recorded for this meter, by the time each was taken.
      chart:
        chartType: line
        source: record-array
        dataField: samples
        encodings:
          x: {field: timestamp, scale: temporal, title: Recorded at}
          y: {field: value, titleField: unit_label}
        # Synthetic examples from domains/saas-billing/examples/usage-api-calls.json.
        sampleRows:
          - {timestamp: "2025-06-15T00:00:00Z", value: 1200}
          - {timestamp: "2025-06-20T00:00:00Z", value: 1800}
          - {timestamp: "2025-06-25T00:00:00Z", value: 1500}

schema:
  usage_id:
    type: string
    required: true
    description: Identifier for this usage record.
  subscription_id:
    type: string
    required: true
    description: Subscription the usage belongs to.
  customer_name:
    type: string
    required: false
    description: Customer account the usage is billed to.
  meter_id:
    type: string
    required: true
    description: Provider specific meter identifier.
  provider:
    type: string
    required: true
    description: Source provider for usage data.
  status:
    type: string
    required: false
    description: Health of the usage feed (ok, delayed, investigating).
    default: ok
    validation:
      enum:
        - ok
        - delayed
        - investigating
  trend_percent:
    type: number
    required: false
    description: Percent delta compared to previous window.
  currency:
    type: string
    required: false
    description: ISO 4217 currency the usage is billed in, the subscription's currency.
  variance_minor:
    type: integer
    required: false
    description: Currency impact of usage variance calculated with overage rate.
  last_reported_at:
    type: datetime
    required: true
    description: Timestamp of the most recent provider usage payload.
  anomalies:
    type: UsageAnomaly[]
    required: false
    description: Detected anomalies with context for investigation.
    default: []

semantics:
  # The meter names the record (SaaSBillingMetered's meter_name, marked as the label), ahead of the customer it bills.
  meter_name:
    semantic_type: text.label
    token_mapping: tokenMap(billing.usage.meter_name)
  usage_id:
    semantic_type: billing.usage.id
    token_mapping: tokenMap(billing.usage.id)
  subscription_id:
    semantic_type: billing.usage.subscription_id
    token_mapping: tokenMap(billing.usage.subscription_id)
  # The one-line summary under the meter's name in lists: whose usage it is.
  customer_name:
    semantic_type: text.summary
    token_mapping: tokenMap(billing.usage.customer_name)
  meter_id:
    semantic_type: billing.usage.meter_id
    token_mapping: tokenMap(billing.usage.meter_id)
  provider:
    semantic_type: billing.usage.provider
    token_mapping: tokenMap(billing.usage.provider)
  status:
    semantic_type: billing.usage.status
    token_mapping: tokenMap(billing.usage.status)
  trend_percent:
    semantic_type: billing.usage.trend_percent
    token_mapping: tokenMap(billing.usage.trend_percent)
    # s223-m01 (#2527 ruling 4): a percent reads with its sign (12.5%).
    ui_hints:
      format: percent
  currency:
    semantic_type: billing.usage.currency
    token_mapping: tokenMap(billing.usage.currency)
  variance_minor:
    semantic_type: billing.usage.variance_minor
    token_mapping: tokenMap(billing.usage.variance_minor)
    ui_hints:
      component: CurrencyAmount
      currencyField: currency
      minorUnits: 100
  last_reported_at:
    semantic_type: billing.usage.last_reported_at
    token_mapping: tokenMap(billing.usage.last_reported_at)
  anomalies:
    semantic_type: billing.usage.anomalies
    token_mapping: tokenMap(billing.usage.anomalies)

tokens:
  billing.usage.status.ok: "var(--cmp-badge-text-success)"
  billing.usage.status.delayed: "var(--cmp-badge-text-warning)"
  billing.usage.status.investigating: "var(--cmp-badge-text-critical)"
  billing.usage.trend_percent: "var(--cmp-text-accent)"

metadata:
  owners:
    - Analytics team
    - Product ops team
  maturity: beta
  references:
    - R13.5 Canonical Model: Subscription and Invoice

# Authored type associations; no record join or referential-integrity claim.
relationships:
  - target: Subscription
    via: subscription_id
    cardinality: many-to-one
    label: Subscription

# Eight authored sample meter readings for the sample subscriptions, in API calls. Each reading's samples sum to its
