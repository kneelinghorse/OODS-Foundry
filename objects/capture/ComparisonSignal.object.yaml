object:
  name: ComparisonSignal
  version: 0.3.0
  domain: capture.comparison
  visibility: internal
  description: >-
    One difference a drift analysis recorded between a captured product's live value and its design's values, with
    both comparands retained. It is not an accessibility finding.
  tags:
    - comparison
    - read-only
traits:
  - name: behavioral/Searchable
    parameters:
      placeholder: Search signals
  - name: behavioral/Filterable
  - name: behavioral/Pageable
    parameters:
      defaultPageSize: 20
      pageSizeOptions:
        - 10
        - 20
        - 50
  - name: core/Assessable
    parameters:
      recordedStates:
        - measured
        - measured_zero
        - not_measured
        - not_applicable
        - needs_review
        - unknown
  - name: core/Provenanced
    parameters:
      source: Capture tool
