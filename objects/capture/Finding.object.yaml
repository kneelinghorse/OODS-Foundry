object:
  name: Finding
  version: 0.3.0
  domain: capture.finding
  visibility: internal
  description: >-
    One accessibility rule's result on one captured page, with the engine that reported it and the evidence the
    run attests. Violations and needs-review items carry their reasons; page-level counts alone never become
    findings.
  tags:
    - capture
    - finding
    - accessibility
traits:
  - name: behavioral/Searchable
    parameters:
      placeholder: Search findings
  - name: behavioral/Filterable
  - name: behavioral/Pageable
    parameters:
      defaultPageSize: 20
      pageSizeOptions:
        - 10
        - 20
        - 50
  - name: core/Assessable
    parameters:
      recordedStates:
        - violation
        - needs_review
  - name: core/Provenanced
    parameters:
      source: Capture tool
schema:
  finding_id:
    type: string
    required: true
    description: 'The route and rule for a violation; needs-review appends "#needs_review" so both results have distinct stable identities.'
    examples:
      - /about/monthly-calls#aria-allowed-attr
      - /about/monthly-calls#aria-prohibited-attr
      - /about/monthly-calls#button-name
      - /components#aria-allowed-role
      - /components/banner#landmark-unique
      - /components/data-visualizations#empty-table-header
  title:
    type: string
    required: true
    description: The rule's one-line statement of what must hold (axe `help`), which names the finding.
    examples:
      - Elements must only use supported ARIA attributes
      - Elements must only use permitted ARIA attributes
      - Buttons must have discernible text
      - ARIA role should be appropriate for the element
      - Landmarks should have a unique role or role/label/title (i.e. accessible name) combination
      - Table header text should not be empty
  description:
    type: string
    required: true
    description: What the rule checks, in the engine's words.
    examples:
      - Ensure an element's role supports its ARIA attributes
      - Ensure ARIA attributes are not prohibited for an element's role
      - Ensure buttons have discernible text
      - Ensure role attribute has an appropriate value for the element
      - Ensure landmarks are unique
      - Ensure table headers have discernible text
  impact:
    type: string
    required: true
    description: The engine's impact for the rule. The capture keeps an unknown bucket beside axe's four.
    validation:
      enum:
        - critical
        - serious
        - moderate
        - minor
        - unknown
    examples:
      - critical
      - serious
      - critical
      - minor
      - moderate
      - minor
  rule_id:
    type: string
    required: true
    description: The engine's rule id.
    examples:
      - aria-allowed-attr
      - aria-prohibited-attr
      - button-name
      - aria-allowed-role
      - landmark-unique
      - empty-table-header
  route:
    type: string
    required: true
    description: The page the finding is on, as a route.
    examples:
      - /about/monthly-calls
      - /about/monthly-calls
      - /about/monthly-calls
      - /components
      - /components/banner
      - /components/data-visualizations
  page_url:
    type: string
    required: true
    description: The page's full URL.
    examples:
      - https://designsystem.digital.gov/about/monthly-calls
      - https://designsystem.digital.gov/about/monthly-calls
      - https://designsystem.digital.gov/about/monthly-calls
      - https://designsystem.digital.gov/components
      - https://designsystem.digital.gov/components/banner
      - https://designsystem.digital.gov/components/data-visualizations
  node_count:
    type: integer
    required: true
    description: How many elements on the page fail the rule.
    validation:
      minimum: 1
    examples:
      - 21
      - 21
      - 21
      - 47
      - 2
      - 1
  selectors:
    type: string[]
    required: true
    description: The failing elements, as the engine's selectors.
    examples:
      - - .usa-embed-container.margin-top-4:nth-child(9) > iframe
        - .ytmVideoInfoVideoTitle
        - .usa-embed-container.margin-top-4:nth-child(14) > iframe
        - iframe[title="Engineering values"]
        - .usa-embed-container.margin-top-4:nth-child(24) > iframe
        - iframe[title="A look at beta Web Components"]
        - .usa-embed-container.margin-top-4:nth-child(34) > iframe
        - .usa-embed-container.margin-top-4:nth-child(39) > iframe
        - iframe[title="Introduction to Web Components"]
        - iframe[title="Building with USWDS tools"]
        - iframe[title="USWDS component lifecycle"]
        - .usa-embed-container.margin-top-4:nth-child(59) > iframe
        - .usa-embed-container.margin-top-4:nth-child(64) > iframe
        - .usa-embed-container.margin-top-4:nth-child(69) > iframe
        - iframe[title="Mission, vision, and polestar"]
        - iframe[title="Product roadmap"]
        - .usa-embed-container.margin-top-4:nth-child(84) > iframe
        - iframe[title="Real-world accessibility"]
        - iframe[title="Top tasks"]
