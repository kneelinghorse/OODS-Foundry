metadata:
  maturity: alpha
  detailTab: Result
  owners:
    - OODS Foundry
  supportedContexts:
    - list
    - detail
    - card
    - inline
  references:
    - objects/provenance.v1.json#/references/ref-2988db1b1980
  changelog:
    - version: 0.1.0
      date: '2026-09-21'
      description: Born from the retained capture analysis and its 15 real signals.
    - version: 0.2.0
      date: '2026-09-22'
      description: >-
        Reads as a result first: a one-line description, the value joins in sentences, and the identifiers,
        digests and provenance on the Identity and provenance tab. Nothing new is measured.
    - version: 0.3.0
      date: '2026-09-23'
      description: >-
        The first tab is named Result, and the state the capture recorded is its last labelled row instead of a chip on its
        own above the result. Nothing new is measured.

# Authored type associations; no record join or referential-integrity claim.
relationships:
  - target: Run
    via: source_capture_id
    cardinality: many-to-one
    label: Source capture
