object:
  name: Grant
  version: 1.0.0
  domain: core.governance
  description: A standing yes that one actor may act for a person or organization, on stated terms, until it ends.
  tags:
    - universal
    - governance
    - core
    - grant

# A grant is a standing yes, not a setting. One record is one set of terms on which one holder may act for one party, as
# given by one giver, until it ends: who asked for it, who gave it and in what capacity, who holds it, who it is for, what
# it covers, its three lines for that party, its limits, its end, its use as the product counts it, and how it ended (the
# Mandate trait's fields). Its terms are never edited in place: a change of terms is a new grant that names the one it
# replaces, which ends as replaced and is kept whole, and "always allow" for one action is a new grant inside the first,
# with its own bounds and end. Taking a grant back is its Revoke, which asks once first and ends the grants inside it
# with it, or the same move of its status to revoked on its form. The one who answers for it is the owner, a person or a
# team, never an agent. OODS Foundry keeps and shows the record; it does not check a grant against what an actor does,
# expire or renew one, or decide whether an action was allowed. A generated app's Revoke, Pause and Resume change the
# app's own records when a person asks, and its store keeps the declared order; they stop nothing outside the app.
traits:
  - name: core/Mandate
  - name: lifecycle/Stateful
    alias: GrantState
    parameters:
      states:
        - requested
        - active
        - paused
        - revoked
        - expired
        - replaced
        - declined
        - withdrawn
      initialState: requested
      # The order your product enforces. A grant is asked for, then given, declined or withdrawn by its asker, or it expires
      # when no one answers in time (s249); a given grant may be paused and resumed, and ends one of three ways: taken back
      # (revoked), at its end or from disuse (expired), or replaced by a grant with other terms. The five endings are final
      # (empty lists), so a grant never comes back: a new one follows it and names it. OODS Foundry holds its own samples to
      # the order, and a generated app keeps it: its status select offers only the moves it allows, and its store refuses
      # any other.
      transitionRules:
        requested: [active, declined, withdrawn, expired]
        active: [paused, revoked, expired, replaced]
        paused: [active, revoked, expired, replaced]
        revoked: []
        expired: []
        replaced: []
        declined: []
        withdrawn: []
      # s249-m03: the moves a person makes on a grant. Revoke ends it, asks once first, writes the note given (if any) as
      # why it ended and who ended it when the app is told, and ends the grants inside it with it. Pause can be undone:
      # Resume gives it again, and only someone who may give grants for the party should resume it (shown, not checked).
      # A move to expired, replaced, declined or withdrawn has no action: it saves as an edit, from the form's status
      # select or from your product.
      actions:
        - { id: revoke, to: revoked, verb: Revoke, event: ended, reasonField: ended_reason, bySeat: ended_by, confirm: true, alsoEnds: { via: within_id } }
        - { id: pause, to: paused, verb: Pause, event: paused }
        - { id: resume, from: [paused], to: active, verb: Resume, event: resumed }
  - name: lifecycle/Timestampable
    alias: GrantTimes
    parameters:
      recordedEvents:
        - requested
        - granted
        - paused
        - resumed
        - ended
        - updated
      timezone: UTC
  # The one who answers for the grant: a person or a team, never an agent. By default it is the one who gave it.
  - name: structural/Ownerable
    alias: GrantAnswers
    parameters:
      ownerTypes:
        - user
        - team
      primaryOwnerType: user
      allowTransfer: true

schema:
  grant_id:
    type: uuid
    required: true
    description: Primary identifier for the grant, the id a history entry's grant_id points at.
  name:
    type: string
    required: true
    description: What the grant is called, in a few words ("Tidewater invoices and payments").
    validation:
      minLength: 1
      maxLength: 120
  owner_name:
    type: string
    required: false
    description: Who answers for the grant, a person or a team, as shown.

semantics:
  grant_id:
    semantic_type: governance.grant.id
    token_mapping: tokenMap(identity.id.primary)
  name:
    semantic_type: text.label
    token_mapping: tokenMap(identity.name.primary)
  # The one-line summary under the grant's name in lists: what it covers.
  scope:
    semantic_type: text.summary
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Covers
  # structural/Ownerable's owner reference: the one who answers for the grant, named by owner_name.
  owner_id:
    semantic_type: ownership.owner.id
    token_mapping: tokenMap(ownership.owner.id)
    ui_hints:
      component: OwnerReference
      ownerTypeField: owner_type
      displayLabelField: owner_name

tokens:
  identity.id.primary: "var(--text-strong)"
  identity.name.primary: "var(--text-strong)"

metadata:
  owners:
    - Core team
    - Platform team
  steward: Design team
  maturity: alpha
  changelog:
    - version: 1.0.0
      date: "2026-11-14"
      description: Initial Grant object, the fifteenth public reference object; a grant is a standing yes, not a setting.
  # s249-m01: the lists this object's detail page shows of the records that point at one of its records, seat by seat,
  # declared here on the page that shows them (packages/mcp-server/src/objects/related-lists.ts says what each key means).
  # They read the registered objects' records by id only, never by name.
  relatedLists:
    - id: inside
      label: Grants inside it
      empty: No grant sits inside this one.
      sources:
        - { from: Grant, via: within_id, row: { line: [scope], time: ends_note } }
    - id: replaced-by
      label: Replaced by
      empty: No grant replaces this one.
      sources:
        - { from: Grant, via: replaces_id, row: { line: [scope] } }
    # The records whose lines name the grant, each with its lines, beside the product's own count where the grant holds one.
    - id: recorded
      label: Recorded under it
      empty: No recorded change names this grant.
      beside: { field: uses, one: Your product counts 1 use., other: "Your product counts {value} uses." }
      sources:
        - { from: [Task, Approval, Transaction, Grant], via: "state_history[].grant_id" }
    # The same records that are not final, or not known; on an ended grant, read at its end, with their state then and now.
    - id: under-way
      label: Still under way
      empty: No record that names this grant is under way.
      filtered: { one: 1 record that names this grant has reached an end., other: "{count} records that name this grant have reached an end." }
      note: These are only the records here that name this grant; work under it elsewhere is not shown.
      finality: [not_final, not_known]
      sources:
        - { from: [Task, Approval, Transaction, Grant], via: "state_history[].grant_id" }
    - id: after-end
      label: Recorded after it ended
      empty: Nothing was recorded under it after it ended.
      afterEnd: true
      sources:
        - { from: [Task, Approval, Transaction, Grant], via: "state_history[].grant_id" }
    # s250-m03: once the grant has ended, the closure a product recorded for it, with its lines (the third part of the
    # Grant story). A request never given gets none, and a grant that ended with its outer grant gets none of its own (your
    # product may name it, in words, in a line of the outer grant's closure), so the empty sentence says only what the list
    # reads.
    - id: closure
      label: Its closure
      empty: No closure here is of this grant.
      afterEnd: true
      sources:
        - { from: Closure, via: closes_id, lines: true, row: { line: [summary], time: ended_at } }
    # Its seats' own records as they stand now, by forward lookup; a seat with no record here shows its kept name and kind.
    - id: parties
      label: Its parties now
      empty: No party of this grant is a record here.
      sources:
        - { from: User, key: granted_by_id, seat: Given by, kept: { name: granted_by_name, kind: granted_by_kind } }
        - { from: [Agent, User], key: granted_to_id, seat: Held by, kept: { name: granted_to_name, kind: granted_to_kind } }
        - { from: [Organization, User], key: granted_for_id, seat: For, kept: { name: granted_for_name } }
        - { from: User, key: owner_id, seat: Answers for it, kept: { name: owner_name, kind: owner_type } }

# Eight authored sample grants. Each names its giver and its holder as shipped User and Agent samples, the party it is for
# as a shipped Organization, and the one who answers for it as a shipped User or the team an Agent sample names as its
# sponsor. The first carries on the Tidewater story: Ruth Adeyemi's grant to the Billing Agent, and the standing yes inside
# it that the Billing Agent asked Ruth for and she gave after the 28 September resend, for returned transfers only, within
# limits. "Northwind customer replies" ended with work under way: Dana Whitfield revoked it on 8 October while the task
# it was used for still needed her answer, so the task stays as it was. Taking the grant back ended the yes, not the work
# (s249). Every line an agent writes for a party in any shipped sample names the grant it acted under, active at the time; every grant that stands, and is not
# inside another, is restated in its holder's acts_for. Each history follows the declared order from requested, and every
# actor acts inside the dates of its own record. A grant's uses count the moments its holder acted under it: one act can
# write lines on several records at once (the 21:00 resend writes the payment's, the task's and the approval's). Times are
# UTC, as the records keep them; the end is also kept in the party's own zone and words.
