object:
  name: User
  version: 1.5.0
  domain: core.identity
  description: Canonical identity record representing a platform user across lifecycle contexts.
  tags:
    - universal
    - identity
    - core

traits:
  # s244-m01 (#2829): a user is a person who can act. Actor adds no field, so User's records and screens are unchanged.
  - name: core/Actor
    parameters:
      kind: person
  - name: lifecycle/Stateful
    alias: UserLifecycle
    parameters:
      states:
        - invited
        - active
        - suspended
        - deactivated
      initialState: active
  - name: lifecycle/Timestampable
    alias: AuditTrail
    parameters:
      recordedEvents:
        - created
        - profile_updated
        - status_changed
        - role_updated
      timezone: UTC
      allowNullUpdatedAt: false
  - name: behavioral/Taggable
    alias: AffinityTags
    parameters:
      maxTags: 12
      allowCustomTags: false
      allowedTags:
        - admin
        - beta_tester
        - vip
        - suspended
      caseSensitive: false
  - name: core/Addressable
    alias: UserAddresses
    parameters:
      roles:
        - home
        - billing
        - shipping
      defaultRole: home
  - name: core/Preferenceable
    alias: UserPreferences
    parameters:
      namespaces:
        - theme
        - notifications
        - display
        - privacy
      schemaVersion: 2.0.0
      registryNamespace: user-preferences
  - name: core/Authable
    alias: UserAuthz
    parameters:
      hierarchyDepthLimit: 5
  - name: core/Communicable
    alias: UserCommunications

schema:
  user_id:
    type: uuid
    required: true
    description: Primary identifier used to correlate identity across services.
  name:
    type: string
    required: true
    description: Human-friendly name rendered in headers and list contexts.
    validation:
      minLength: 1
      maxLength: 120
  preferred_name:
    type: string
    required: false
    description: Preferred display name surfaced in collaborative tooling.
  description:
    type: string
    required: false
    description: Supporting summary rendered in detail and card contexts.
    validation:
      maxLength: 160
  primary_email:
    type: email
    required: true
    description: Canonical login email address for the user.
  role:
    type: string
    required: true
    default: end_user
    description: Highest privilege role currently granted to the user.
    validation:
      enum:
        - end_user
        - admin
        - owner
        - billing
  timezone:
    type: string
    required: false
    default: UTC
    description: The person's preferred time zone, kept for your product. Screens show times in UTC, and a shown date-time says so, as a date-time input's label does.

semantics:
  user_id:
    semantic_type: identity.user.id
    token_mapping: tokenMap(identity.id.primary)
  name:
    semantic_type: identity.user.name
    token_mapping: tokenMap(identity.name.primary)
  preferred_name:
    semantic_type: identity.user.name_preferred
    token_mapping: tokenMap(identity.name.preferred)
  # The one-line summary under the user's name in lists.
  description:
    semantic_type: text.summary
    token_mapping: tokenMap(identity.description.summary)
  primary_email:
    semantic_type: identity.user.email
    token_mapping: tokenMap(identity.email.primary)
  role:
    semantic_type: identity.user.role
    token_mapping: tokenMap(identity.role.*)
  timezone:
    semantic_type: identity.user.timezone
    token_mapping: tokenMap(identity.timezone.primary)

tokens:
  identity.id.primary: "var(--text-strong)"
  identity.name.primary: "var(--text-strong)"
  identity.email.primary: "var(--text-subtle)"
  identity.role.admin: "var(--status-info)"
  identity.timezone.primary: "var(--text-muted)"
  identity.description.summary: "var(--text-subtle)"

metadata:
  owners:
    - Identity team
    - Platform team
  steward: Design team
  maturity: stable
  changelog:
    - version: 1.5.0
      date: "2026-11-07"
      description: Composed the Actor trait as a person, so a user is named where an actor is (history, memberships, delegations); no field or screen changed.
    - version: 1.4.0
      date: "2025-11-20"
      description: Composed Authable trait to attach RBAC memberships and entitlement exports.
    - version: 1.3.0
      date: "2025-11-19"
      description: Added Preferenceable trait for schema-governed user preferences (theme, notifications, display, privacy).
    - version: 1.2.0
      date: "2025-11-18"
      description: Added Addressable trait for multi-role user addresses (home, billing, shipping).
    - version: 1.1.0
      date: "2025-10-18"
      description: Simplified composition for view engine integration (Stateful, Timestampable, Taggable).
    - version: 1.0.0
      date: "2025-10-16"
      description: Initial Universal Quintet baseline.
  # s249-m01: the lists this object's detail page shows of the records that point at one of its records, seat by seat,
  # declared here on the page that shows them (packages/mcp-server/src/objects/related-lists.ts says what each key means).
  # They read the registered objects' records by id only, never by name.
  relatedLists:
    # Ordered by due date, then oldest first, with no "late" label: static output has no clock.
    - id: waiting
      label: "Waiting for {name}'s answer"
      empty: "Nothing waits for {name}'s answer."
      sources:
        - { from: Approval, via: asked_of_id, states: [waiting], order: due_at, row: { line: [requested_by_name], time: due_at } }
        - { from: Task, via: waiting_on_id, when: { waiting_on_type: User }, states: [needs_input], order: due_at, row: { line: [asked_of_name], time: due_at } }
        # s249-m03: a grant asked for and waiting on this person's yes, including a standing yes asked for inside a grant.
        # A request holds no due date, so it follows the asks that do, oldest first.
        - { from: Grant, via: asked_of_id, when: { asked_of_kind: person }, states: [requested], row: { line: [requested_by_name, scope] } }
    # s249-m03 (Interface 4): the two lists of standing grants a person may end say, under their rows, where to end one;
    # a generated User app cannot act on the Grant app's records.
    - id: acting-for
      label: "Agents holding a grant for {name}"
      empty: "No agent holds a grant for {name} now."
      filtered: { one: "1 other grant for {name} is asked for or has ended.", other: "{count} other grants for {name} are asked for or have ended." }
      rowsNote: "This list does not change grants: revoke one on the grant's own page."
      sources:
        - from: Grant
          via: granted_for_id
          when: { granted_to_kind: agent, within_id: null }
          states: [active, paused]
          inner: within_id
          row: { line: [granted_to_name, scope, last_use, { says: No uses counted, when: { uses: 0 } }], time: ends_note }
    # s250-m03 (next step 1888): only the grants given for this person that stand; the ended ones are kept apart below. Who
    # should end one is said under the rows, in words, and that this app does not check who is asking.
    - id: given-for
      label: "Given for {name} by someone else"
      empty: "No grant given for {name} by someone else stands now."
      rowsNote: "This list does not change grants. Only someone who may give grants for {name} should end one, on the grant's own page; this app does not check who is asking."
      sources:
        - { from: Grant, via: granted_for_id, exclude: [granted_by_id], when: { within_id: null }, states: [active, paused], inner: within_id, row: { line: [granted_by_name, granted_to_name, scope, last_use, { says: No uses counted, when: { uses: 0 } }], time: ends_note } }
    - id: gave
      label: "Grants {name} gave"
      empty: "No grant {name} gave stands now."
      filtered: { one: "1 other grant {name} gave no longer stands.", other: "{count} other grants {name} gave no longer stand." }
      rowsNote: "This list does not change grants: revoke one on the grant's own page."
      sources:
        - from: Grant
          via: granted_by_id
          when: { granted_by_kind: person, within_id: null }
          states: [active, paused]
          inner: within_id
          row: { line: [granted_to_name, granted_for_name, scope, last_use, { says: No uses counted, when: { uses: 0 } }], time: ends_note }
    - id: answers-for
      label: "Grants {name} answers for"
      empty: "No grant asked for or standing now names {name} as the one who answers for it."
      filtered: { one: "1 grant {name} answers for has ended.", other: "{count} grants {name} answers for have ended." }
      sources:
        - from: Grant
          via: owner_id
          when: { owner_type: user, within_id: null }
          states: [requested, active, paused]
          inner: within_id
          row: { line: [granted_to_name, granted_for_name, scope, last_use, { says: No uses counted, when: { uses: 0 } }], time: ends_note }
    - id: sponsors
      label: "Agents {name} sponsors"
      empty: "No agent names {name} as its sponsor."
      sources:
        # s250-m04 (next step 1887, item 4): an agent that acts for no one keeps acts_for "None"; the row leaves it out.
        - { from: Agent, via: owner_id, when: { owner_type: user }, row: { line: [{ field: acts_for, except: None }] } }
    - id: approved
      label: "What {name} approved"
      empty: "No recorded change names {name} as the one who approved it."
      sources:
        - { from: [Task, Approval, Transaction, Grant], via: "state_history[].approved_by_id" }
    # s250-m03 (next step 1888): an ended list keeps only grants that hold a giver, since expired is reachable from requested
    # and a request that expired unanswered was never given.
    - id: ended-grants
      label: "Ended grants {name} gave"
      empty: "No grant {name} gave has ended."
      collapsed: true
      sources:
        - from: Grant
          via: granted_by_id
          when: { granted_by_kind: person, within_id: null, granted_by_id: { present: true } }
          states: [revoked, expired, replaced]
          inner: within_id
          row: { line: [granted_to_name, granted_for_name, scope] }
    - id: ended-given-for
      label: "Ended grants given for {name} by someone else"
      empty: "No grant given for {name} by someone else has ended."
      collapsed: true
      sources:
        - from: Grant
          via: granted_for_id
          exclude: [granted_by_id]
          when: { within_id: null, granted_by_id: { present: true } }
          states: [revoked, expired, replaced]
          inner: within_id
          row: { line: [granted_by_name, granted_to_name, scope] }
    # s250-m03: the closures that name this person, one list per seat, since one heading cannot be true of both: the one who
    # answers for a closure (a person's id only, as for the grants they answer for), and the party an ended grant was for.
    - id: closures
      label: "Closures {name} answers for"
      empty: "No closure here names {name} as the one who answers for it."
      sources:
        - { from: Closure, via: owner_id, when: { owner_type: user }, order: ended_at, lines: true, row: { line: [summary], time: ended_at } }
    - id: closures-for
      label: "Closures of grants for {name}"
      empty: "No closure here is of a grant for {name}."
      sources:
        - { from: Closure, via: for_id, order: ended_at, lines: true, row: { line: [summary], time: ended_at } }

