object:
  name: Relationship
  version: 1.1.0
  domain: core.graph
  description: Canonical graph edge linking two entities with lifecycle, ownership, and tagging semantics.
  tags:
    - universal
    - relationship
    - graph

traits:
  - name: content/Labelled
    alias: RelationshipLabel
  - name: lifecycle/Stateful
    parameters:
      states:
        - proposed
        - active
        - paused
        - completed
        - terminated
      initialState: proposed
  - name: lifecycle/Timestampable
    parameters:
      recordedEvents:
        - created
        - activated
        - paused
        - terminated
        - reactivated
      timezone: UTC
  - name: structural/Ownerable
    parameters:
      ownerTypes:
        - organization
        - team
        - platform
      primaryOwnerType: organization
      allowTransfer: true
  - name: behavioral/Taggable
    parameters:
      maxTags: 10
      allowCustomTags: true
      allowedTags:
        - primary
        - secondary
        - inferred
        - manual
        - pending_review
      caseSensitive: false

  - name: viz/MarkGraph
    parameters:
      title: Connected relationships
      description: This relationship and the others that share one of its endpoints.
      chart:
        chartType: force_graph
        source: edge-array
        dataField: neighborhood
        edges:
          source: source_id
          target: target_id
          bidirectionalField: is_bidirectional
        sampleRows:
          - { source_id: example-team, target_id: example-project, is_bidirectional: false }
          - { source_id: example-project, target_id: example-document, is_bidirectional: true }

schema:
  neighborhood:
    type: array
    required: false
    description: This relationship's edge and the edges that share one of its endpoints, each containing source_id and target_id strings and an is_bidirectional boolean.
  relationship_id:
    type: uuid
    required: true
    description: Primary identifier for the relationship edge.
  source_id:
    type: uuid
    required: true
    description: Identifier of the source node in the relationship.
  source_name:
    type: string
    required: false
    description: Display name of the source node.
  target_id:
    type: uuid
    required: true
    description: Identifier of the target node in the relationship.
  target_name:
    type: string
    required: false
    description: Display name of the target node.
  relationship_type:
    type: string
    required: true
    description: Semantic type describing the edge between the source and target.
    validation:
      enum:
        - membership
        - ownership
        - follows
        - depends_on
        - references
  direction:
    type: string
    required: true
    default: bidirectional
    description: Directionality applied when traversing the relationship.
    validation:
      enum:
        - unidirectional
        - bidirectional
  strength:
    type: string
    required: false
    description: Signal representing how strongly the entities are connected.
    validation:
      enum:
        - low
        - medium
        - high
  origin_source:
    type: string
    required: false
    description: System that originated or inferred the relationship.
    validation:
      enum:
        - manual
        - ingestion
        - analytics
        - integration
  is_bidirectional:
    type: boolean
    required: true
    default: true
    description: Flag indicating whether the relationship is symmetric.
  owner_name:
    type: string
    required: false
    description: Display name of the organization, team or platform that owns the relationship.

semantics:
  # The one-line summary under the relationship's name in lists (content/Labelled's description, marked as the summary).
  description:
    semantic_type: text.summary
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: TextBody
      maxLengthParameter: maxDescriptionLength
  relationship_id:
    semantic_type: graph.relationship.id
    token_mapping: tokenMap(graph.relationship.id)
  source_id:
    semantic_type: graph.relationship.source_id
    token_mapping: tokenMap(graph.relationship.id)
    ui_hints:
      displayLabelField: source_name
  target_id:
    semantic_type: graph.relationship.target_id
    token_mapping: tokenMap(graph.relationship.id)
    ui_hints:
      displayLabelField: target_name
  # structural/Ownerable's owner reference, named by owner_name.
  owner_id:
    semantic_type: ownership.owner.id
    token_mapping: tokenMap(ownership.owner.id)
    ui_hints:
      component: OwnerReference
      ownerTypeField: owner_type
      displayLabelField: owner_name
  relationship_type:
    semantic_type: graph.relationship.type
    token_mapping: tokenMap(graph.relationship.type)
  direction:
    semantic_type: graph.relationship.direction
    token_mapping: tokenMap(graph.relationship.direction)
  strength:
    semantic_type: graph.relationship.strength
    token_mapping: tokenMap(graph.relationship.strength)
  origin_source:
    semantic_type: graph.relationship.origin
    token_mapping: tokenMap(graph.relationship.origin)

tokens:
  graph.relationship.type: "var(--graph-relationship-type)"
  graph.relationship.direction: "var(--text-default)"
  graph.relationship.strength.high: "var(--status-success)"

metadata:
  owners:
    - Data team
    - Platform team
  steward: Graph team
  changelog:
    - version: 1.1.0
      date: "2026-09-14"
      description: Declared neighborhood edge array and a read-only graph of explicitly synthetic connected relationship examples.
    - version: 1.0.0
      date: "2025-10-16"
      description: Initial Universal Quintet baseline.

