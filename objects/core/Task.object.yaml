object:
  name: Task
  version: 1.0.0
  domain: core.work
  description: One ask to one person or agent to do one piece of work, and what became of it.
  tags:
    - universal
    - work
    - core
    - task

# A task is an ask, not a ticket. One record is one ask to one actor to do one piece of work: who asked, and for whom; who
# is doing it; exactly what was asked; what the work is about and what it waits on; and what became of it (the
# Assignment trait's fields). The thing the work is about (an invoice, a payment, an issue) stays its own record, and the
# task points at it. The state of the work is the record's lifecycle; a changed ask is a new task, handing the whole of
# the work on ends this one and starts another that names it, and asking for help with a part starts another while this
# one waits. The one who answers for the work is the owner, a person or a team, never an agent: a person doing the work
# answers for it; when an agent is doing it and a person asked, the person who asked; otherwise the doing agent's sponsor.
# OODS Foundry keeps and shows the record; it does not run, retry, pause, cancel or time out the work, or check who may
# do it. The one change it refuses is a generated app's Cancel from a state the order does not let move to cancelled.
traits:
  - name: core/Assignment
  - name: lifecycle/Stateful
    alias: TaskState
    parameters:
      states:
        - not_started
        - working
        - needs_input
        - waiting
        - paused
        - outcome_unknown
        - finished
        - failed
        - declined
        - cancelled
        - handed_over
      initialState: not_started
      # The order the product enforces. A task is started, may need a person, wait on something else, be paused by a
      # person or not know whether its last step took, and ends one of five ways; the endings are final (empty lists),
      # so a second ask is a second record. OODS Foundry keeps the order, holds its own samples to it, and in a generated
      # React or Vue app reads it only for Cancel, which it offers and accepts only where the order allows.
      transitionRules:
        not_started: [working, paused, declined, cancelled, handed_over]
        working: [needs_input, waiting, paused, outcome_unknown, finished, failed, declined, cancelled, handed_over]
        needs_input: [working, paused, failed, cancelled, handed_over]
        waiting: [working, paused, outcome_unknown, finished, failed, cancelled, handed_over]
        paused: [working, needs_input, waiting, cancelled, handed_over]
        outcome_unknown: [working, waiting, paused, finished, failed, cancelled, handed_over]
        finished: []
        failed: []
        declined: []
        cancelled: []
        handed_over: []
  - name: lifecycle/Timestampable
    alias: TaskTimes
    parameters:
      recordedEvents:
        - created
        - started
        - asked_for_input
        - paused
        - ended
        - updated
      timezone: UTC
  # The one who answers for the work: a person or a team, never an agent.
  - name: structural/Ownerable
    alias: TaskAnswers
    parameters:
      ownerTypes:
        - user
        - team
      primaryOwnerType: user
      allowTransfer: true
  # A person stops a task with a reason; the record is cancelled whatever the work had already done.
  - name: lifecycle/Cancellable
    alias: TaskCancellation
    parameters:
      allowCancellationAfterStart: true
      requireReason: true
      allowedReasons:
        - no_longer_needed
        - asked_in_error
        - done_another_way

schema:
  task_id:
    type: uuid
    required: true
    description: Primary identifier for the task, the id a history entry's task_id points at.
  name:
    type: string
    required: true
    description: What the task is called, in a few words ("Get INV-2026-0155 paid").
    validation:
      minLength: 1
      maxLength: 120
  owner_name:
    type: string
    required: false
    description: Who answers for the work, a person or a team, as shown.

semantics:
  task_id:
    semantic_type: work.task.id
    token_mapping: tokenMap(identity.id.primary)
  name:
    semantic_type: text.label
    token_mapping: tokenMap(identity.name.primary)
  # The one-line summary under the task's name in lists: exactly what was asked.
  instruction:
    semantic_type: text.summary
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: What was asked
  # structural/Ownerable's owner reference: the one who answers for the work, named by owner_name.
  owner_id:
    semantic_type: ownership.owner.id
    token_mapping: tokenMap(ownership.owner.id)
    ui_hints:
      component: OwnerReference
      ownerTypeField: owner_type
      displayLabelField: owner_name

tokens:
  identity.id.primary: "var(--text-strong)"
  identity.name.primary: "var(--text-strong)"

metadata:
  owners:
    - Core team
    - Platform team
  steward: Design team
  maturity: alpha
  changelog:
    - version: 1.0.0
      date: "2026-11-13"
      description: Initial Task object, the fourteenth public reference object; a task is an ask, not a ticket.

# Eight authored sample tasks. Each names its asker and the one doing it as shipped User and Agent samples, and the one
# who answers for it as a shipped User or the team an Agent sample names as its sponsor; each is for a shipped
# Organization. The first carries on the Tidewater story: the Billing Agent's own task to get INV-2026-0155 paid, which
# needed Ruth Adeyemi's yes and now waits on the bank. No agent does anything its own record never allows, or anything it
# must ask first for without the yes; each acts within the dates of its own history, and for a party only where its own
# grants name that party. Every task is created not started (the lifecycle's initial state), and each history follows
# the declared order to the task's status. Times are UTC, as the records keep them.
