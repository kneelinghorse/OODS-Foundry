object:
  name: Memory
  version: 1.0.0
  domain: core.governance
  description: What an assistant or an agent keeps about a person, as the product that holds it shows it. A memory is a claim, not a fact.
  tags:
    - universal
    - governance
    - core
    - memory

# What an assistant or an agent keeps about a person: what it says, who made it and how, the grant it is kept under, and what
# removing it would leave. A memory is a claim, not a fact: it may be what the person said or what the assistant
# concluded on its own, and the page says which, or that it is not known. One memory is what its holder can remove by
# itself, as your product shows it: an entry, a summary or a file. A memory gives no authority: a habit it records never
# stands in for a yes. An agent keeps a memory for a party only under a grant whose lines name keeping notes, and taking
# the grant back ends the yes, not the memory.
#
# Its facts are the Remembered trait's. Its lines are its history: each names who acted and when, never the words, old
# or new. A correction, the person's own statement and a rewrite by a model that no one asked for are lines that keep
# the state, written from: null. A memory is active or paused (kept and not used), and either is replaced when a newer
# entry takes its place or removed when the product reports it removed; replaced moves only to removed, and removed is
# final. An expiry that hides is a pause; one that removes is a removal by time. A removed memory holds no words, no
# note on its source and no statement from the person: its page says who removed it and when, and what the product
# reports remains. Removing a memory removes the entry, not what it shaped.
#
# It is read-only in OODS Foundry: it composes no form and so no workflow, and its page offers no Edit, no Delete and no
# move. The memory lives in your product's own store, which writes these records. OODS Foundry models and shows the
# record; it stores no memory, removes none, tells no one and checks nothing, and it never says what removing one leaves
# beyond what your product reports.
traits:
  - name: core/Remembered
  - name: lifecycle/Stateful
    alias: MemoryState
    parameters:
      states:
        - active
        - paused
        - replaced
        - removed
      initialState: active
      # The order your product keeps. A memory is made active; it is paused (kept and not used) and used again; either
      # is replaced by a newer entry or removed; replaced moves only to removed, and removed is final (an empty list).
      transitionRules:
        active: [paused, replaced, removed]
        paused: [active, replaced, removed]
        replaced: [removed]
        removed: []
  - name: lifecycle/Timestampable
    alias: MemoryTimes
    parameters:
      recordedEvents:
        - made
        - changed
        - removed
      timezone: UTC

schema:
  memory_id:
    type: uuid
    required: true
    description: Primary identifier for the memory.
  name:
    type: string
    required: true
    description: 'The name other records keep for the memory: who it is about and when it was made ("Memory about Ruth Adeyemi, 28 Sep 2026, 21:12 UTC"). Never its words.'
    validation:
      minLength: 1
      maxLength: 160
  summary:
    type: string
    required: false
    description: 'One line about the memory under its name in lists: who keeps it and what last happened to it. Never its words.'
    validation:
      maxLength: 240

semantics:
  created_at:
    semantic_type: audit.created_at
    token_mapping: tokenMap(audit.created)
    ui_hints:
      label: Made
  updated_at:
    semantic_type: audit.updated_at
    token_mapping: tokenMap(audit.updated)
    ui_hints:
      label: Last changed
  memory_id:
    semantic_type: governance.memory.id
    token_mapping: tokenMap(identity.id.primary)
  name:
    semantic_type: text.label
    token_mapping: tokenMap(identity.name.primary)
  # The one-line summary under the memory's name in lists: who keeps it and what last happened to it.
  summary:
    semantic_type: text.summary
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Last happened

tokens:
  identity.id.primary: "var(--text-strong)"
  identity.name.primary: "var(--text-strong)"

metadata:
  owners:
    - Core team
    - Platform team
  steward: Design team
  maturity: alpha
  # Read-only: no form, so no workflow, no Edit, no Delete and no move.
  supportedContexts:
    - card
    - detail
    - inline
    - list
    - timeline
  changelog:
    - version: 1.0.0
      date: "2026-11-27"
      description: Initial Memory object, the seventeenth public reference object; a memory is a claim, not a fact.

# Eight memories, about Ruth Adeyemi and Mei Chen of Tidewater Co-op, kept by the Billing Agent under the Tidewater grant,
# and about Tomas Lindqvist, kept by the Inventory Agent for him under no grant, since an agent acting for its own sponsor
# acts under none. Between them they rest in every state, are made in every way and one way not known, and show a
# summary and a file, a correction, a replaced pair, a removal with what remains, a person's own statement, an expiry
# and a rewrite no one asked for. No line carries a memory's words, and a name is never its words. Times are UTC.
