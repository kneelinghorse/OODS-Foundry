object:
  name: Approval
  version: 1.0.0
  domain: core.governance
  description: One ask to one person or agent for a yes, about one version of one thing, and the answer it became.
  tags:
    - universal
    - governance
    - core
    - approval

# An approval is a decision, not a status. One record is one ask to one actor that becomes their answer: who asked, and
# for whom; who was asked; who answered, and for whom when a delegate or an agent answered; about exactly what they were
# shown, at what level of yes, and what that yes means (the Decision trait's fields). It always points at one thing, a
# Transaction or an Article in the samples, and keeps that thing's name, so it still reads after the thing changes or is
# deleted. The answer is the record's lifecycle. The rule for which change needs which level, and the outcome worked out
# from the approvals that still stand, live on the thing (Approvable). OODS Foundry keeps and shows the record; it does
# not ask anyone, check who may answer, count answers, expire an ask or stop a change.
traits:
  - name: core/Decision
    parameters:
      levels:
        - acknowledgement
        - review
        - approval
        - sign_off
  - name: lifecycle/Stateful
    alias: ApprovalAnswer
    parameters:
      states:
        - not_yet_asked
        - waiting
        - approved
        - declined
        - out_of_date
        - taken_back
        - expired
        - withdrawn
        - not_needed
        - used
      initialState: not_yet_asked
  - name: lifecycle/Timestampable
    alias: ApprovalTimes
    parameters:
      recordedEvents:
        - created
        - asked
        - answered
        - ended
        - updated
      timezone: UTC

schema:
  approval_id:
    type: uuid
    required: true
    description: Primary identifier for the approval, the id a history entry's approval_id points at.
  name:
    type: string
    required: true
    description: What is asked, in a few words ("Approve the resend of PAY-2026-0429").
    validation:
      minLength: 1
      maxLength: 120

semantics:
  approval_id:
    semantic_type: governance.approval.id
    token_mapping: tokenMap(identity.id.primary)
  name:
    semantic_type: text.label
    token_mapping: tokenMap(identity.name.primary)
  # The one-line summary under the approval's name in lists: exactly what the person was shown.
  shown:
    semantic_type: text.summary
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: What was shown

tokens:
  identity.id.primary: "var(--text-strong)"
  identity.name.primary: "var(--text-strong)"

metadata:
  owners:
    - Core team
    - Platform team
  steward: Design team
  maturity: alpha
  changelog:
    - version: 1.0.0
      date: "2026-11-11"
      description: Initial Approval object, the thirteenth public reference object; an approval is a decision, not a status.

# Eight authored sample approvals, each about a Transaction or Article sample, named by that record's reference or slug and
