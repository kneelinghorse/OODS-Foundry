object:
  name: Closure
  version: 1.0.0
  domain: core.governance
  description: The third part of the Grant story, what a product reports became of the work after a grant ended. Only a report should move it, a rule your product keeps.
  tags:
    - universal
    - governance
    - core
    - closure

# The third part of the Grant story: a grant is a standing yes (0.15.0), a person sees their grants and takes one back
# (0.16.0), and a closure is what a product reports became of the work after a grant ended (0.17.0). Taking a grant back
# ends the yes, not the work. A product opens one closure for each grant that was given and then ended: revoked,
# replaced, or expired after it was given. A request that was declined, withdrawn or left to expire was never given and
# gets none, and a grant that ended with its outer grant gets none of its own: your product may name it, in words, in a
# line of the outer grant's closure.
#
# Its facts are the Closeout trait's: what ended and how, when, who it was for, what the closure covers, where it stands,
# when your product stops waiting for answers, until when access already given may still work, and the receipt as sent.
# Its lines are its history: each names who reported it, and a line that reports without moving the state (a party
# told, a party's answer, a piece of work's fate, the receipt sent) keeps the state it stands in, written from: null.
# Only a report should move a closure, a rule your product keeps; time and silence close nothing. A product's own
# deadline line may move it to not known, never to reported closed or failed. Reported closed means nothing more can start under the grant, as reported, for the
# stated scope; it never means everything stopped. A reported-closed closure moves again only to failed, on a report that
# something that had to stop did not, and failed is final.
#
# It is read-only in OODS Foundry: it composes no form and so no workflow, and its page offers no Edit, no Delete and no
# move. A product writes its closures from reports. OODS Foundry models and shows the record; it writes no closure,
# tells no one, stops nothing and cannot know whether everything stopped. The receipt is sent outside the page by your
# product; the closure's own page, drawn by your product from its own record with the generated components, is its
# content.
traits:
  - name: core/Closeout
  - name: lifecycle/Stateful
    alias: ClosureState
    parameters:
      states:
        - closing
        - reported_closed
        - still_running
        - not_known
        - failed
      initialState: closing
      # The order your product keeps. A closure opens closing, when its grant ends; a report moves it to reported closed,
      # still running, not known or failed. Reported closed moves only to failed, on a report that something that had to
      # stop did not, and failed is final (an empty list): what is done about it afterwards is a line on the failed
      # closure. The order cannot tell a deadline line from another report, so no check holds the deadline rule; the
      # product keeps it.
      transitionRules:
        closing: [reported_closed, still_running, not_known, failed]
        still_running: [reported_closed, not_known, failed]
        not_known: [reported_closed, still_running, failed]
        reported_closed: [failed]
        failed: []
  - name: lifecycle/Timestampable
    alias: ClosureTimes
    parameters:
      recordedEvents:
        - opened
        - reported
        - updated
      timezone: UTC
  # The one who answers for the closure: the one who answered for the grant when it ended, a person or a team.
  - name: structural/Ownerable
    alias: ClosureAnswers
    parameters:
      ownerTypes:
        - user
        - team
      primaryOwnerType: user
      allowTransfer: true

schema:
  closure_id:
    type: uuid
    required: true
    description: Primary identifier for the closure.
  name:
    type: string
    required: true
    description: What the closure is called, saying it is a closure and of what ("Closure of Northwind customer replies").
    validation:
      minLength: 1
      maxLength: 160
  owner_name:
    type: string
    required: false
    description: Who answers for the closure, a person or a team, as shown.

semantics:
  closure_id:
    semantic_type: governance.closure.id
    token_mapping: tokenMap(identity.id.primary)
  name:
    semantic_type: text.label
    token_mapping: tokenMap(identity.name.primary)
  # The one-line summary under the closure's name in lists: where it stands now.
  summary:
    semantic_type: text.summary
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: Text
      label: Where it stands
  # structural/Ownerable's owner reference: the one who answers for the closure, named by owner_name.
  owner_id:
    semantic_type: ownership.owner.id
    token_mapping: tokenMap(ownership.owner.id)
    ui_hints:
      component: OwnerReference
      ownerTypeField: owner_type
      displayLabelField: owner_name

tokens:
  identity.id.primary: "var(--text-strong)"
  identity.name.primary: "var(--text-strong)"

metadata:
  owners:
    - Core team
    - Platform team
  steward: Design team
  maturity: alpha
  # Read-only: no form, so no workflow, no Edit, no Delete and no move.
  supportedContexts:
    - card
    - detail
    - inline
    - list
    - timeline
  changelog:
    - version: 1.0.0
      date: "2026-11-17"
      description: Initial Closure object, the sixteenth public reference object and the third part of the Grant story; what a product reports became of the work after a grant ended.
  # The lists a closure's page shows. Each reads a field of the closure through key (the grant it closes, the party), so
  # the page says its rows were matched by id. The grant's end is the closure's own ended_at (endedAt), so a row is read
  # at the instant the grant ended, not at the closure's own state.
  relatedLists:
    - id: ended
      label: The grant and its party now
      empty: Neither the grant nor its party is a record here.
      sources:
        - { from: Grant, key: closes_id, seat: Grant, kept: { name: closes_name }, row: { line: [ended_reason] } }
        - { from: [Organization, User], key: for_id, seat: For, kept: { name: for_name } }
    - id: under-way
      label: Still under way when the grant ended, by the records here
      empty: No record here that names the grant was under way when it ended.
      note: These are read from the records here that name the grant. They are not a report.
      endedAt: { field: ended_at, noun: grant }
      finality: [not_final, not_known]
      sources:
        - { from: [Task, Approval, Transaction, Grant], via: "state_history[].grant_id", key: closes_id }
    - id: after-end
      label: Recorded under the grant after it ended
      empty: Nothing here was recorded under the grant after it ended.
      endedAt: { field: ended_at, noun: grant }
      afterEnd: true
      sources:
        - { from: [Task, Approval, Transaction, Grant], via: "state_history[].grant_id", key: closes_id }

# Three authored closures, one for each shipped Grant sample that was given and then ended, in the order the grants
# ended, so the third is the one a measured detail screen shows. Each names its grant, the grant's party and the one who
# answered for the grant at its end as the shipped records do. Every line names its reporter: the product's own system,
# or a service it told, each named in words, so no line carries the id of a shipped record. Times are UTC.
