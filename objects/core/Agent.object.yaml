object:
  name: Agent
  version: 1.1.2
  domain: core.identity
  description: An AI agent that acts inside a product, for the people and organizations it is granted to act for.
  tags:
    - universal
    - identity
    - core
    - agent

# s244-m02 (#2829): an agent is an actor, not a user. It is an object of its own and shares one trait with User, Actor: the
# ability to act. It answers to a sponsor (a person or team), holds roles, has a lifecycle of its own, and acts for others
# only under a grant (a Grant record from the person or organization to the agent, s248). Approval is a rule per action
# (allowed, ask first, never), never a property of the agent's identity; a grant can narrow it for one party, and a
# standing yes inside a grant can give an asks-first action's yes in advance. Every field is one line of text:
# a list is written as one string with its items separated by "; ", and "None" when it is empty.
traits:
  - name: core/Actor
    parameters:
      kind: agent
  - name: lifecycle/Stateful
    alias: AgentLifecycle
    parameters:
      states:
        - draft
        - active
        - paused
        - retired
      initialState: draft
  - name: structural/Ownerable
    alias: AgentSponsor
    parameters:
      ownerTypes:
        - user
        - team
      primaryOwnerType: user
      allowTransfer: true
  - name: core/Authable
    alias: AgentRoles
    parameters:
      hierarchyDepthLimit: 5
  - name: lifecycle/Timestampable
    alias: AgentAuditTrail
    parameters:
      recordedEvents:
        - created
        - activated
        - paused
        - retired
        - updated
      timezone: UTC

schema:
  agent_id:
    type: uuid
    required: true
    description: Primary identifier for the agent.
  name:
    type: string
    required: true
    description: The name the agent is shown by, in its own record and in every history it appears in.
    validation:
      minLength: 1
      maxLength: 80
  description:
    type: string
    required: false
    description: What the agent is for, in one line.
    validation:
      maxLength: 160
  provider:
    type: string
    required: true
    description: Who built or runs the agent.
  skills:
    type: string
    required: true
    description: What the agent can do, separated by "; " (Look up orders; Draft replies; Issue refunds).
  acts_for:
    type: string
    required: true
    description: Who the agent acts for, one phrase per party restating the grant it holds for that party (organization · scope · until), separated by "; ". A standing yes inside a grant is covered by the grant it sits in and is not restated.
  allowed_actions:
    type: string
    required: true
    description: Actions the agent may take with no one's yes, under any grant that allows them, separated by "; "; None when there are none.
  asks_first_for:
    type: string
    required: true
    description: Actions that need a person's yes before the agent takes them, asked each time or given in advance by a standing yes under a grant, separated by "; "; None when there are none.
  never_allowed:
    type: string
    required: true
    description: Actions nothing permits the agent to take, separated by "; "; None when there are none.
  owner_name:
    type: string
    required: false
    description: Display name of the person or team that sponsors the agent.

semantics:
  agent_id:
    semantic_type: identity.agent.id
    token_mapping: tokenMap(identity.id.primary)
  name:
    semantic_type: identity.agent.name
    token_mapping: tokenMap(identity.name.primary)
  # The one-line summary under the agent's name in lists.
  description:
    semantic_type: text.summary
    token_mapping: tokenMap(identity.description.summary)
  provider:
    semantic_type: identity.agent.provider
    token_mapping: tokenMap(text.body.*)
  skills:
    semantic_type: identity.agent.skills
    token_mapping: tokenMap(text.body.*)
  acts_for:
    semantic_type: identity.agent.acts_for
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      valueLabels:
        None: No party listed
  allowed_actions:
    semantic_type: identity.agent.approval.allowed
    token_mapping: tokenMap(text.body.*)
  asks_first_for:
    semantic_type: identity.agent.approval.ask_first
    token_mapping: tokenMap(text.body.*)
  never_allowed:
    semantic_type: identity.agent.approval.never
    token_mapping: tokenMap(text.body.*)
  # structural/Ownerable's owner reference: the agent's sponsor, named by owner_name.
  owner_id:
    semantic_type: ownership.owner.id
    token_mapping: tokenMap(ownership.owner.id)
    ui_hints:
      component: OwnerReference
      ownerTypeField: owner_type
      displayLabelField: owner_name

tokens:
  identity.id.primary: "var(--text-strong)"
  identity.name.primary: "var(--text-strong)"
  identity.description.summary: "var(--text-subtle)"

metadata:
  owners:
    - Identity team
    - Platform team
  steward: Design team
  maturity: alpha
  changelog:
    - version: 1.1.2
      date: "2026-11-27"
      description: The Billing Agent's and the Inventory Agent's go-ahead lines name keeping notes about the people they deal with, the act a memory records. An agent's page lists what it keeps, and "Work {name} did" names the kinds of record it reads.
    - version: 1.1.1
      date: "2026-11-19"
      description: Lists the grants the agent holds and those under its standing grants. The Order Agent’s parties match its grant, and a stored None has an explanation on the page.
    - version: 1.1.0
      date: "2026-11-14"
      description: The four rule fields say what they mean beside a grant; acts_for restates the grant held for each party, and asks first means a yes, asked each time or given in advance.
    - version: 1.0.0
      date: "2026-11-07"
      description: Initial Agent object, the twelfth public reference object; an agent is an actor, not a user.
  # s249-m01: the lists this object's detail page shows of the records that point at one of its records, seat by seat,
  # declared here on the page that shows them (packages/mcp-server/src/objects/related-lists.ts says what each key means).
  # They read the registered objects' records by id only, never by name.
  # The agent's own acts_for stays a field: the product's words beside the record.
  relatedLists:
    - id: acts-for
      label: "Grants {name} holds"
      empty: "{name} holds no grant now."
      filtered: { one: "1 other grant to {name} is asked for or has ended.", other: "{count} other grants to {name} are asked for or have ended." }
      sources:
        - from: Grant
          via: granted_to_id
          when: { granted_to_kind: agent, within_id: null }
          states: [active, paused]
          inner: within_id
          row: { line: [granted_for_name, scope, last_use, { says: No uses counted, when: { uses: 0 } }], time: ends_note }
    - id: work
      label: "Work {name} did"
      empty: "No change to a task, approval, payment or grant here names {name} as the one who acted."
      sources:
        - { from: [Task, Approval, Transaction, Grant], via: "state_history[].actor_id" }
    # s255-m04 (settled 10): the memories this agent keeps, oldest first, each with its words, how it was made and whom it
    # is about; a removed one is not listed here.
    - id: keeps
      label: "What {name} keeps"
      empty: "{name} keeps no memory here now."
      rowsNote: "A summary can hold more than one thing, and a store elsewhere may keep more than is listed here."
      sources:
        - { from: Memory, via: kept_by_id, states: [active, paused, replaced], order: created_at, row: { line: [{ field: words, says: What it says }, { field: origin, says: How it was made }, { field: about_name, says: About }], time: created_at } }
    # s250-m03 (next step 1888): only grants that hold a giver, since a request that expired unanswered was never held.
    - id: ended-grants
      label: "Ended grants {name} held"
      empty: "No grant {name} held has ended."
      collapsed: true
      sources:
        - from: Grant
          via: granted_to_id
          when: { granted_to_kind: agent, within_id: null, granted_by_id: { present: true } }
          states: [revoked, expired, replaced]
          inner: within_id
          row: { line: [granted_for_name, scope] }

# Seven authored sample agents, one at each of seven sample organizations, each sponsored by a person or team there. Six
# have held a grant to act for it, and each acts_for restates the grants its agent holds now, one phrase per party, or
# None. The Grant samples include each grant named here. Two agents whose grants ended hold none now:
# the Scheduling Agent's grant was revoked when
# Marlow Yoga closed, and the Support Agent's on 8 October, when its acts_for was restated as None. The Inventory Agent
# holds none: its one task is its sponsor's own, and its lines name no party. An agent is created as a draft
# (the lifecycle's initial state); each history ends in the agent's status, names who made each change, and its last
# event is the latest recorded change. A list is one line with its items separated by "; ", and None when it is empty.
