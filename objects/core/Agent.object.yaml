object:
  name: Agent
  version: 1.0.0
  domain: core.identity
  description: An AI agent that acts inside a product, for the people and organizations it is granted to act for.
  tags:
    - universal
    - identity
    - core
    - agent

# s244-m02 (#2829): an agent is an actor, not a user. It is an object of its own and shares one trait with User, Actor: the
# ability to act. It answers to a sponsor (a person or team), holds roles, has a lifecycle of its own, and acts for others
# only under a delegation (a Relationship of type delegation from the person or organization to the agent). Approval is a
# rule per action (allowed, ask first, never), never a property of the agent's identity. Every field is one line of text:
# a list is written as one string with its items separated by "; ", and "None" when it is empty.
traits:
  - name: core/Actor
    parameters:
      kind: agent
  - name: lifecycle/Stateful
    alias: AgentLifecycle
    parameters:
      states:
        - draft
        - active
        - paused
        - retired
      initialState: draft
  - name: structural/Ownerable
    alias: AgentSponsor
    parameters:
      ownerTypes:
        - user
        - team
      primaryOwnerType: user
      allowTransfer: true
  - name: core/Authable
    alias: AgentRoles
    parameters:
      hierarchyDepthLimit: 5
  - name: lifecycle/Timestampable
    alias: AgentAuditTrail
    parameters:
      recordedEvents:
        - created
        - activated
        - paused
        - retired
        - updated
      timezone: UTC

schema:
  agent_id:
    type: uuid
    required: true
    description: Primary identifier for the agent.
  name:
    type: string
    required: true
    description: The name the agent is shown by, in its own record and in every history it appears in.
    validation:
      minLength: 1
      maxLength: 80
  description:
    type: string
    required: false
    description: What the agent is for, in one line.
    validation:
      maxLength: 160
  provider:
    type: string
    required: true
    description: Who built or runs the agent.
  skills:
    type: string
    required: true
    description: What the agent can do, separated by "; " (Look up orders; Draft replies; Issue refunds).
  acts_for:
    type: string
    required: true
    description: Who the agent acts for, one phrase per grant (organization · scope · until), grants separated by "; ".
  allowed_actions:
    type: string
    required: true
    description: Actions the agent takes without asking, separated by "; "; None when there are none.
  asks_first_for:
    type: string
    required: true
    description: Actions the agent asks a person to approve before taking, separated by "; "; None when there are none.
  never_allowed:
    type: string
    required: true
    description: Actions the agent never takes, separated by "; "; None when there are none.
  owner_name:
    type: string
    required: false
    description: Display name of the person or team that sponsors the agent.

semantics:
  agent_id:
    semantic_type: identity.agent.id
    token_mapping: tokenMap(identity.id.primary)
  name:
    semantic_type: identity.agent.name
    token_mapping: tokenMap(identity.name.primary)
  # The one-line summary under the agent's name in lists.
  description:
    semantic_type: text.summary
    token_mapping: tokenMap(identity.description.summary)
  provider:
    semantic_type: identity.agent.provider
    token_mapping: tokenMap(text.body.*)
  skills:
    semantic_type: identity.agent.skills
    token_mapping: tokenMap(text.body.*)
  acts_for:
    semantic_type: identity.agent.acts_for
    token_mapping: tokenMap(text.body.*)
  allowed_actions:
    semantic_type: identity.agent.approval.allowed
    token_mapping: tokenMap(text.body.*)
  asks_first_for:
    semantic_type: identity.agent.approval.ask_first
    token_mapping: tokenMap(text.body.*)
  never_allowed:
    semantic_type: identity.agent.approval.never
    token_mapping: tokenMap(text.body.*)
  # structural/Ownerable's owner reference: the agent's sponsor, named by owner_name.
  owner_id:
    semantic_type: ownership.owner.id
    token_mapping: tokenMap(ownership.owner.id)
    ui_hints:
      component: OwnerReference
      ownerTypeField: owner_type
      displayLabelField: owner_name

tokens:
  identity.id.primary: "var(--text-strong)"
  identity.name.primary: "var(--text-strong)"
  identity.description.summary: "var(--text-subtle)"

metadata:
  owners:
    - Identity team
    - Platform team
  steward: Design team
  maturity: alpha
  changelog:
    - version: 1.0.0
      date: "2026-11-07"
      description: Initial Agent object, the twelfth public reference object; an agent is an actor, not a user.

# Seven authored sample agents, one at each of seven sample organizations, each sponsored by a person or team there and
