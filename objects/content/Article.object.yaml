object:
  name: Article
  version: 1.0.0
  domain: content.publication
  description: Canonical editorial article with hybrid taxonomy + tag classification for CMS surfaces.
  tags:
    - content
    - article
    - hybrid
    - classifiable

traits:
  - name: content/Labelled
    alias: ArticleHeadline
  - name: lifecycle/Stateful
    alias: ArticleWorkflow
    parameters:
      states:
        - draft
        - in_review
        - scheduled
        - published
        - archived
      initialState: draft
  - name: lifecycle/Timestampable
    alias: ArticleTimestamps
    parameters:
      recordedEvents:
        - created
        - scheduled
        - published
        - updated
        - archived
      timezone: UTC
  - name: core/Classifiable
    alias: ArticleClassification
    parameters:
      classification_mode: hybrid
      hierarchy_storage_model: materialized_path
      tag_policy: moderated
      max_tags: 24
      require_primary_category: true

schema:
  article_id:
    type: uuid
    required: true
    description: Primary identifier for the article document.
  slug:
    type: string
    required: true
    description: Canonical slug rendered in URLs and breadcrumb links.
    validation:
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  author_id:
    type: uuid
    required: true
    description: Reference to the authoring user.
  author_name:
    type: string
    required: false
    description: Display name of the authoring user.
  content_type:
    type: string
    required: true
    default: knowledge_base
    description: Editorial template driving layout and governance workflows.
    validation:
      enum:
        - knowledge_base
        - announcement
        - release_notes
        - how_to
  excerpt:
    type: string
    required: false
    description: Summary text used in list + SEO contexts.
    validation:
      maxLength: 240
  body_markdown:
    type: string
    required: true
    description: Markdown content rendered in CMS detail views.
  hero_media_id:
    type: string
    required: false
    description: Optional Media object identifier referenced in hero slots.
  reading_time_minutes:
    type: number
    required: false
    description: Estimated reading time derived from body length.
    validation:
      minimum: 1
      maximum: 60
  locale:
    type: string
    required: false
    default: en-US
    description: Locale tag determining headline, copy, and SEO metadata.
  published_at:
    type: datetime
    required: false
    description: Timestamp when the article was published live.

semantics:
  # The one-line summary under the headline in lists (content/Labelled's description, marked as the summary).
  description:
    semantic_type: text.summary
    token_mapping: tokenMap(text.body.*)
    ui_hints:
      component: TextBody
      maxLengthParameter: maxDescriptionLength
  article_id:
    semantic_type: content.article.id
    token_mapping: tokenMap(content.article.id)
  slug:
    semantic_type: content.article.slug
    token_mapping: tokenMap(content.article.slug)
  author_id:
    semantic_type: content.article.author
    token_mapping: tokenMap(identity.user.id)
    ui_hints:
      displayLabelField: author_name
  content_type:
    semantic_type: content.article.type
    token_mapping: tokenMap(content.article.type)
  reading_time_minutes:
    semantic_type: content.article.read_time
    token_mapping: tokenMap(metric.duration.short)
  locale:
    semantic_type: content.article.locale
    token_mapping: tokenMap(content.locale.badge)
  published_at:
    semantic_type: content.article.published_at
    token_mapping: tokenMap(timestamp.published_at)

tokens:
  content.article.id: "var(--sys-text-strong)"
  content.article.slug: "var(--sys-text-muted)"
  content.article.type: "var(--sys-badge-neutral-fg)"
  content.article.read_time: "var(--sys-text-subtle)"
  content.locale.badge: "var(--sys-badge-accent-fg)"
  timestamp.published_at: "var(--sys-text-muted)"

metadata:
  owners:
    - content-platform@oods.systems
    - docs@oods.systems
  steward: publishing@oods.systems
  changelog:
    - version: 1.0.0
      date: "2025-11-18"
      description: Initial article object composing hybrid Classifiable mode for taxonomy + tags.

# Authored type associations; no record join or referential-integrity claim.
relationships:
  - target: User
    via: author_id
    cardinality: many-to-one
    label: Author
  - target: Media
    via: hero_media_id
    cardinality: many-to-one
    label: Hero media

# Eight authored sample help-centre articles about the billing product, written by three editors. Each follows the
# editorial lifecycle from draft (its initial state); only published and archived articles carry a publication date, and
# the heroes are sample Media assets.
samples:
  - label: September 2026 release notes
    description: What changed in billing this month
    slug: september-2026-release-notes
    author_id: 8b2e4d6f-1a3c-4e5b-9d7f-2c4e6a8b0e01
    author_name: Elena Park
    content_type: release_notes
    excerpt: A preview of usage-based pricing, smarter payment retries and faster invoice search.
    body_markdown: |
      ## Payment retries
      Failed card payments now retry on the schedule you choose, and each retry is listed on the invoice.

      ## Invoice search
      Search finds invoices by number, customer or amount in under a second.
    hero_media_id: 5a7c9e1b-3d5f-4a6c-8e0a-2b4d6f8a0c03
    reading_time_minutes: 5
    locale: en-US
    primary_category_id: updates-release-notes
    primary_category_path: Updates > Release notes
    tag_preview: releases
    status: published
    state_history:
      - { title: Drafted, from: null, to: draft, at: '2026-09-22T09:00:00Z', reason: Drafted from the release checklist }
      - { title: In review, from: draft, to: in_review, at: '2026-09-26T15:00:00Z', reason: Sent to product review }
      - { title: Published, from: in_review, to: published, at: '2026-09-29T16:00:00Z', reason: Published with the release }
    published_at: '2026-09-29T16:00:00Z'
    created_at: '2026-09-22T09:00:00Z'
    updated_at: '2026-09-29T16:00:00Z'
    last_event: published
    last_event_at: '2026-09-29T16:00:00Z'
  - label: How prorations work when plans change
    description: Why an upgrade adds a prorated charge
    slug: how-prorations-work
    author_id: 8b2e4d6f-1a3c-4e5b-9d7f-2c4e6a8b0e02
    author_name: Marcus Hale
    content_type: knowledge_base
    excerpt: When a customer upgrades mid-cycle, they pay the difference for the days left in the period.
    body_markdown: |
      An upgrade takes effect straight away. The customer is charged the new price minus the old one, for the days left
      in the current billing period, and the next renewal is at the new price.

      A downgrade takes effect at the end of the period, so no credit is issued.
    hero_media_id: 5a7c9e1b-3d5f-4a6c-8e0a-2b4d6f8a0c01
    reading_time_minutes: 6
    locale: en-US
    primary_category_id: billing-plans
    primary_category_path: Billing > Plans
    tag_preview: prorations, upgrades
    status: published
    state_history:
      - { title: Drafted, from: null, to: draft, at: '2026-06-22T10:00:00Z', reason: Requested by the support team }
      - { title: In review, from: draft, to: in_review, at: '2026-07-01T10:00:00Z', reason: Sent to the billing lead }
      - { title: Published, from: in_review, to: published, at: '2026-07-08T14:00:00Z', reason: Approved and published }
    published_at: '2026-07-08T14:00:00Z'
    created_at: '2026-06-22T10:00:00Z'
    updated_at: '2026-07-08T14:00:00Z'
    last_event: published
    last_event_at: '2026-07-08T14:00:00Z'
  - label: Set up automatic payment retries
    description: Recover failed payments on a schedule
    slug: set-up-automatic-payment-retries
    author_id: 8b2e4d6f-1a3c-4e5b-9d7f-2c4e6a8b0e03
    author_name: Ines Duarte
    content_type: how_to
    excerpt: Choose how often a declined card is retried and when the customer is reminded.
    body_markdown: |
      1. Open Settings, then Payments.
      2. Under Retries, choose up to four attempts over 21 days.
      3. Turn on reminder emails so the customer can update their card before the last retry.
    hero_media_id: 5a7c9e1b-3d5f-4a6c-8e0a-2b4d6f8a0c02
    reading_time_minutes: 4
    locale: en-US
    primary_category_id: billing-payments
    primary_category_path: Billing > Payments
    tag_preview: retries, dunning
    status: published
