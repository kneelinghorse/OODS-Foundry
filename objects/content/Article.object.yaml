  - label: Refund a duplicate charge
    description: Find and refund a charge made twice
    slug: refund-a-duplicate-charge
    author_id: 8b2e4d6f-1a3c-4e5b-9d7f-2c4e6a8b0e03
    author_name: Ines Duarte
    content_type: how_to
    excerpt: Spot two charges for the same period and refund one of them in full.
    body_markdown: |
      Open the customer's payments and look for two charges on consecutive days for the same amount. Open the later one
      and choose Refund; the refund appears on the invoice and in the customer's payment history.
