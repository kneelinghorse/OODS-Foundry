      - { title: In review, from: draft, to: in_review, at: '2026-08-12T09:00:00Z', reason: Sent to the support lead }
      - { title: Published, from: in_review, to: published, at: '2026-08-19T13:00:00Z', reason: Approved and published }
    published_at: '2026-08-19T13:00:00Z'
    created_at: '2026-08-05T09:00:00Z'
    updated_at: '2026-08-19T13:00:00Z'
    last_event: published
    last_event_at: '2026-08-19T13:00:00Z'
  - label: Introducing usage-based billing
    description: Charge for what customers use
    slug: introducing-usage-based-billing
    author_id: 8b2e4d6f-1a3c-4e5b-9d7f-2c4e6a8b0e01
    author_name: Elena Park
    content_type: announcement
    excerpt: Meter API calls or seats, include an allowance in each plan and bill the overage automatically.
    body_markdown: |
      Usage-based billing arrives on October 6. Each plan can include an allowance, and anything above it is billed at
      the rate you set, on the same invoice as the subscription.
    hero_media_id: 5a7c9e1b-3d5f-4a6c-8e0a-2b4d6f8a0c04
    reading_time_minutes: 3
    locale: en-US
    primary_category_id: updates-announcements
