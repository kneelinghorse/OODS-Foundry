    description: What each invoice must show, by region
    slug: invoice-numbers-tax-ids
    author_id: 8b2e4d6f-1a3c-4e5b-9d7f-2c4e6a8b0e02
    author_name: Marcus Hale
    content_type: knowledge_base
    excerpt: The details an invoice needs in the US, the UK and the EU, and where to set them.
    body_markdown: |
      Every invoice shows a unique number, your legal name and address, and the customer's. In the UK and the EU it also
