    description: Stop billing without losing your data
    slug: pause-a-subscription
    author_id: 8b2e4d6f-1a3c-4e5b-9d7f-2c4e6a8b0e03
    author_name: Ines Duarte
    content_type: how_to
    excerpt: Pause billing for up to three months and resume from the same place.
    body_markdown: |
      Open the subscription and choose Pause. Billing stops at the end of the current period, and nothing is deleted.
      Choose Resume at any time to start the next period straight away.
